Name: admin
Host: 0.0.0.0
Port: 8888
# Historical K-line synchronization performs paginated REST reads and MongoDB
# writes synchronously, so the default 3-second HTTP deadline is too short.
Timeout: 120000

Jwt:
  AccessSecret: "your_access_secret"
  AccessExpire: 3600

SystemRpc:
  rpcType: zrpc
  Etcd:
    Hosts:
      - "127.0.0.1:2379"
    Key: system.rpc

UserRpc:
  rpcType: zrpc
  Etcd:
    Hosts:
      - "127.0.0.1:2379"
    Key: user.rpc

PaymentRpc:
  rpcType: zrpc
  Etcd:
    Hosts:
      - "127.0.0.1:2379"
    Key: payment.rpc

ItickRpc:
  rpcType: zrpc
  # Must cover the long-running SyncProductKlineHistory RPC.
  Timeout: 120000
  Etcd:
    Hosts:
      - "127.0.0.1:2379"
    Key: itick.rpc
