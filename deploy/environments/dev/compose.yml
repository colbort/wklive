name: ${DEV_PROJECT_NAME:-wklive}

x-dev-web: &dev-web
  restart: unless-stopped
  init: true
  build:
    context: ..
    dockerfile: deploy/common/docker/Dockerfile.web
  networks:
    - backend

services:
  etcd:
    ports:
      - "2379:2379"

  mysql:
    command: !override
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --binlog-expire-logs-seconds=${DEV_MYSQL_BINLOG_EXPIRE_LOGS_SECONDS:-86400}
    ports:
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"

  mongo:
    ports:
      - "27017:27017"

  kafka:
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  beanstalk-primary:
    ports:
      - "11300:11300"

  beanstalk-secondary:
    ports:
      - "11301:11300"

  db-init:
    env_file:
      - path: ./secrets/production-operators.env
        required: false
    volumes: !override
      - ..:/workspace:ro

  config-seed:
    environment:
      COMMON_CONFIG: /deploy-config/common.yaml
      CHAT_API_CONFIG: /deploy-config/chat.yaml
      CHAT_ADMIN_API_CONFIG: /deploy-config/chatadmin.yaml
      DEV_BACKEND_SUBNET: ${DEV_BACKEND_SUBNET:-172.20.0.0/16}
      SERVICE_MODE: dev
    volumes: !override
      - ..:/workspace:ro
      - ./common/scripts/seed-etcd.sh:/deploy/seed-etcd.sh:ro
      - ./environments/dev/config:/deploy-config:ro

  payment-api:
    ports:
      - "3333:3333"

  app-api:
    ports:
      - "5555:5555"

  chat-admin-api:
    ports:
      - "6666:6666"

  chat-api:
    ports:
      - "7777:7777"

  admin-api:
    volumes:
      - ./data/admin/avatars/:/app/avatars/
    ports:
      - "8888:8888"

  liquidity-admin-api:
    ports:
      - "9999:9999"

  admin-ui:
    <<: *dev-web
    build:
      context: ..
      dockerfile: deploy/common/docker/Dockerfile.web
      args:
        UI_DIR: admin-ui
    environment:
      API_PATH_PREFIX: /admin/
      API_UPSTREAM: admin-api:8888
    depends_on:
      admin-api:
        condition: service_healthy
    ports:
      - "${ADMIN_UI_PORT:-18080}:8080"

  app-web:
    <<: *dev-web
    build:
      context: ..
      dockerfile: deploy/common/docker/Dockerfile.web
      args:
        UI_DIR: app-web
    environment:
      API_PATH_PREFIX: /app/
      API_UPSTREAM: app-api:5555
    depends_on:
      app-api:
        condition: service_healthy
    ports:
      - "${APP_WEB_PORT:-18081}:8080"

  app-mobile:
    <<: *dev-web
    build:
      context: ..
      dockerfile: deploy/common/docker/Dockerfile.web
      args:
        UI_DIR: app-mobile
    environment:
      API_PATH_PREFIX: /app/
      API_UPSTREAM: app-api:5555
    depends_on:
      app-api:
        condition: service_healthy
    ports:
      - "${APP_MOBILE_PORT:-18084}:8080"

  chat-admin-ui:
    <<: *dev-web
    build:
      context: ..
      dockerfile: deploy/common/docker/Dockerfile.web
      args:
        UI_DIR: chat-admin-ui
    environment:
      API_PATH_PREFIX: /chat/admin/
      API_UPSTREAM: chat-admin-api:6666
    depends_on:
      chat-admin-api:
        condition: service_healthy
    ports:
      - "${CHAT_ADMIN_UI_PORT:-18082}:8080"

  chat-ui:
    <<: *dev-web
    build:
      context: ..
      dockerfile: deploy/common/docker/Dockerfile.web
      args:
        UI_DIR: chat-ui
    environment:
      API_PATH_PREFIX: /chat
      API_UPSTREAM: chat-api:7777
    depends_on:
      chat-api:
        condition: service_healthy
    ports:
      - "${CHAT_UI_PORT:-18085}:8080"

  liquidity-admin-ui:
    <<: *dev-web
    build:
      context: ..
      dockerfile: deploy/common/docker/Dockerfile.web
      args:
        UI_DIR: liquidity-admin-ui
    environment:
      API_PATH_PREFIX: /admin/liquidity/
      API_UPSTREAM: liquidity-admin-api:9999
    depends_on:
      liquidity-admin-api:
        condition: service_healthy
    ports:
      - "${LIQUIDITY_ADMIN_UI_PORT:-18083}:8080"

secrets:
  itick_token:
    file: ./secrets/itick_token

networks:
  backend:
    ipam:
      config:
        - subnet: ${DEV_BACKEND_SUBNET:-172.20.0.0/16}
