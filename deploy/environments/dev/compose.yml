name: ${DEV_PROJECT_NAME:-wklive}

services:
  etcd:
    ports:
      - "2379:2379"

  mysql:
    ports:
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"

  mongo:
    ports:
      - "27017:27017"

  kafka:
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  beanstalk-primary:
    ports:
      - "11300:11300"

  beanstalk-secondary:
    ports:
      - "11301:11300"

  db-init:
    env_file:
      - path: ./secrets/production-operators.env
        required: false
    volumes: !override
      - ..:/workspace:ro

  config-seed:
    environment:
      COMMON_CONFIG: /deploy-config/common.yaml
      SERVICE_MODE: dev
    volumes: !override
      - ..:/workspace:ro
      - ./common/scripts/seed-etcd.sh:/deploy/seed-etcd.sh:ro
      - ./environments/dev/config:/deploy-config:ro

  payment-api:
    ports:
      - "3333:3333"

  app-api:
    ports:
      - "5555:5555"

  chat-admin-api:
    ports:
      - "6666:6666"

  chat-api:
    ports:
      - "7777:7777"

  admin-api:
    volumes:
      - ./data/admin/avatars/:/app/avatars/
    ports:
      - "8888:8888"

  liquidity-admin-api:
    ports:
      - "9999:9999"

secrets:
  itick_token:
    file: ./secrets/itick_token
