Log:
  Mode: console
  Encoding: json
  Stat: true
  Level: info

Mysql:
  DataSource: __MYSQL_APP_USER__:__MYSQL_APP_PASSWORD__@tcp(mysql:3306)/wklive?charset=utf8mb4&parseTime=true&loc=Local

CacheRedis:
  - Host: redis:6379
    Pass: __REDIS_PASSWORD__
    Type: node

Redis:
  Key: wklive-preprod
  Host: redis:6379
  Pass: __REDIS_PASSWORD__
  Type: node

DataCache:
  Key: wklive-preprod
  Host: redis:6379
  Pass: __REDIS_PASSWORD__
  Type: node

LockRedis:
  Key: wklive-preprod
  Host: redis:6379
  Pass: __REDIS_PASSWORD__
  Type: node

MQ:
  Brokers:
    - kafka:9092
  MinBytes: 1
  MaxBytes: 10485760
  MaxAttempts: 8
  RetryBackoffMs: 1000

Jwt:
  AccessSecret: change-this-secret-before-production
  AccessExpire: 3600
