name: wklive

x-go-service: &go-service
  restart: unless-stopped
  init: true
  environment:
    TZ: ${TZ:-Asia/Hong_Kong}
  healthcheck:
    test: ["CMD-SHELL", "nc -z 127.0.0.1 \"$$HEALTHCHECK_PORT\""]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s
  depends_on:
    config-seed:
      condition: service_completed_successfully
  networks:
    - backend

x-go-build: &go-build
  context: ..
  dockerfile: deploy/Dockerfile.go

services:
  etcd:
    image: quay.io/coreos/etcd:v3.7.1
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - etcd-data:/etcd-data
    ports:
      - "2379:2379"
    networks:
      - backend

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: wklive
      TZ: ${TZ:-Asia/Hong_Kong}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - backend

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-openIM123}
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --host 127.0.0.1 --username root --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - backend

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    networks:
      - backend

  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: ["/bin/bash", "/deploy/kafka-init.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-1}
      KAFKA_REPLICATION_FACTOR: "1"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka-init.sh:/deploy/kafka-init.sh:ro
    networks:
      - backend

  beanstalk-primary:
    image: schickling/beanstalkd:latest
    restart: unless-stopped
    ports:
      - "11300:11300"
    networks:
      - backend

  beanstalk-secondary:
    image: schickling/beanstalkd:latest
    restart: unless-stopped
    ports:
      - "11301:11300"
    networks:
      - backend

  db-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.db-init
    environment:
      MYSQL_DSN: ${MYSQL_DSN:-}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_EXTERNAL_HOST: ${MYSQL_EXTERNAL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wklive}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in deploy/.env}
      LIQUIDITY_ADMIN_USERNAME: ${LIQUIDITY_ADMIN_USERNAME:-liquidityadmin}
      LIQUIDITY_ADMIN_PASSWORD: ${LIQUIDITY_ADMIN_PASSWORD:?LIQUIDITY_ADMIN_PASSWORD must be set in deploy/.env}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ..:/workspace:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend

  config-seed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.seed
    environment:
      ETCD_ENDPOINT: ${ETCD_ENDPOINT:-http://etcd:2379}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-openIM123}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-secret-before-production}
    depends_on:
      etcd:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ..:/workspace:ro
      - ./seed-etcd.sh:/deploy/seed-etcd.sh:ro
      - ./config:/deploy-config:ro
    secrets:
      - itick_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend

  system-rpc:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "8080"
    build:
      <<: *go-build
      args:
        SERVICE_DIR: services/system
    command: ["-etcd", "etcd:2379"]
    expose: ["8080"]

  user-rpc:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "8081"
    depends_on:
      system-rpc:
        condition: service_healthy
    build:
      <<: *go-build
      args:
        SERVICE_DIR: services/user
    command: ["-etcd", "etcd:2379"]
    expose: ["8081"]

  market-rpc:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "8082"
    build:
      <<: *go-build
      args:
        SERVICE_DIR: services/market
    command: ["-etcd", "etcd:2379"]
    expose: ["8082"]

  payment-rpc:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "8083"
    depends_on:
      asset-rpc:
        condition: service_healthy
    build:
      <<: *go-build
      args:
        SERVICE_DIR: services/payment
    command: ["-etcd", "etcd:2379"]
    expose: ["8083"]

  asset-rpc:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "8084"
    build:
      <<: *go-build
      args:
        SERVICE_DIR: services/asset
    command: ["-etcd", "etcd:2379"]
    expose: ["8084"]

  option-rpc:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "8085"
    depends_on:
      asset-rpc:
        condition: service_healthy
    build:
      <<: *go-build
      args:
        SERVICE_DIR: services/option
    command: ["-etcd", "etcd:2379"]
    expose: ["8085"]

  staking-rpc:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "8086"
    depends_on:
      asset-rpc:
        condition: service_healthy
    build:
      <<: *go-build
      args:
        SERVICE_DIR: services/staking
    command: ["-etcd", "etcd:2379"]
    expose: ["8086"]

  trade-rpc:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "8087"
    depends_on:
      asset-rpc:
        condition: service_healthy
      market-rpc:
        condition: service_healthy
    build:
      <<: *go-build
      args:
        SERVICE_DIR: services/trade
    command: ["-etcd", "etcd:2379"]
    expose: ["8087"]

  chat-rpc:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "8088"
    build:
      <<: *go-build
      args:
        SERVICE_DIR: services/chat
    command: ["-etcd", "etcd:2379"]
    expose: ["8088"]

  liquidity-rpc:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "8089"
    depends_on:
      asset-rpc:
        condition: service_healthy
      market-rpc:
        condition: service_healthy
      trade-rpc:
        condition: service_healthy
      user-rpc:
        condition: service_healthy
    build:
      <<: *go-build
      args:
        SERVICE_DIR: services/liquidity
    command: ["-etcd", "etcd:2379"]
    expose: ["8089"]

  payment-api:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "3333"
    depends_on:
      payment-rpc:
        condition: service_healthy
    build:
      <<: *go-build
      args:
        SERVICE_DIR: payment-api
    command: ["-etcd", "etcd:2379"]
    ports:
      - "3333:3333"

  app-api:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "5555"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      asset-rpc:
        condition: service_healthy
      market-rpc:
        condition: service_healthy
      option-rpc:
        condition: service_healthy
      payment-rpc:
        condition: service_healthy
      staking-rpc:
        condition: service_healthy
      system-rpc:
        condition: service_healthy
      trade-rpc:
        condition: service_healthy
      user-rpc:
        condition: service_healthy
    build:
      <<: *go-build
      args:
        SERVICE_DIR: app-api
    command: ["-etcd", "etcd:2379"]
    ports:
      - "5555:5555"

  chat-admin-api:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "6666"
    depends_on:
      chat-rpc:
        condition: service_healthy
    build:
      <<: *go-build
      args:
        SERVICE_DIR: chat-admin-api
    command: ["-etcd", "etcd:2379"]
    ports:
      - "6666:6666"

  chat-api:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "7777"
    depends_on:
      chat-rpc:
        condition: service_healthy
    build:
      <<: *go-build
      args:
        SERVICE_DIR: chat-api
    command: ["-etcd", "etcd:2379"]
    ports:
      - "7777:7777"

  admin-api:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "8888"
    depends_on:
      asset-rpc:
        condition: service_healthy
      chat-rpc:
        condition: service_healthy
      market-rpc:
        condition: service_healthy
      option-rpc:
        condition: service_healthy
      payment-rpc:
        condition: service_healthy
      staking-rpc:
        condition: service_healthy
      system-rpc:
        condition: service_healthy
      trade-rpc:
        condition: service_healthy
      user-rpc:
        condition: service_healthy
    build:
      <<: *go-build
      args:
        SERVICE_DIR: admin-api
    volumes:
      - ./data/admin/avatars/:/app/avatars/
    command: ["-etcd", "etcd:2379"]
    secrets:
      - operational_alert_webhook
    ports:
      - "8888:8888"

  liquidity-admin-api:
    <<: *go-service
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HEALTHCHECK_PORT: "9999"
    depends_on:
      liquidity-rpc:
        condition: service_healthy
      system-rpc:
        condition: service_healthy
    build:
      <<: *go-build
      args:
        SERVICE_DIR: liquidity-admin-api
    command: ["-etcd", "etcd:2379"]
    ports:
      - "9999:9999"

networks:
  backend:
    driver: bridge

secrets:
  itick_token:
    file: ./secrets/itick_token
  operational_alert_webhook:
    file: ./secrets/operational_alert_webhook

volumes:
  etcd-data:
  mysql-data:
  redis-data:
  mongo-data:
  kafka-data:
