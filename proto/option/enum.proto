syntax = "proto3";

package option;

option go_package = "wklive/proto/option;option";

enum OptionType {
  OPTION_TYPE_UNKNOWN = 0;
  OPTION_TYPE_CALL = 1; // 看涨
  OPTION_TYPE_PUT = 2; // 看跌
}

enum ExerciseStyle {
  EXERCISE_STYLE_UNKNOWN = 0;
  EXERCISE_STYLE_EUROPEAN = 1; // 欧式
  EXERCISE_STYLE_AMERICAN = 2; // 美式
}

enum SettlementType {
  SETTLEMENT_TYPE_UNKNOWN = 0;
  SETTLEMENT_TYPE_CASH = 1; // 现金结算
  SETTLEMENT_TYPE_PHYSICAL = 2; // 实物交割
}

enum ContractStatus {
  CONTRACT_STATUS_UNKNOWN = 0;
  CONTRACT_STATUS_PENDING = 1; // 待上市
  CONTRACT_STATUS_TRADING = 2; // 可交易
  CONTRACT_STATUS_PAUSED = 3; // 暂停交易
  CONTRACT_STATUS_EXPIRED = 4; // 已到期
  CONTRACT_STATUS_SETTLED = 5; // 已结算
  CONTRACT_STATUS_OFFLINE = 6; // 已下线
}

enum PositionEffect {
  POSITION_EFFECT_UNKNOWN = 0;
  POSITION_EFFECT_OPEN = 1; // 开仓
  POSITION_EFFECT_CLOSE = 2; // 平仓
}

enum OrderType {
  ORDER_TYPE_UNKNOWN = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
  ORDER_TYPE_POST_ONLY = 3;
  ORDER_TYPE_IOC = 4;
  ORDER_TYPE_FOK = 5;
}

enum OrderSource {
  ORDER_SOURCE_UNKNOWN = 0;
  ORDER_SOURCE_APP = 1;
  ORDER_SOURCE_WEB = 2;
  ORDER_SOURCE_API = 3;
  ORDER_SOURCE_ADMIN = 4;
}

enum OrderStatus {
  ORDER_STATUS_UNKNOWN = 0;
  ORDER_STATUS_PENDING = 1; // 待撮合
  ORDER_STATUS_PART_FILLED = 2; // 部分成交
  ORDER_STATUS_FILLED = 3; // 完全成交
  ORDER_STATUS_CANCELED = 4; // 已撤单
  ORDER_STATUS_REJECTED = 5; // 拒单
  ORDER_STATUS_EXPIRED = 6; // 已过期
  ORDER_STATUS_FUNDING = 7; // 资金冻结中，禁止进入订单簿
  ORDER_STATUS_CANCELING = 8; // 撤单资金处理中
  ORDER_STATUS_EXPIRING = 9; // 到期撤单资金处理中
}

// Option 发往 Asset 的资金指令动作。
enum AssetInstructionAction {
  ASSET_INSTRUCTION_ACTION_UNKNOWN = 0;
  ASSET_INSTRUCTION_ACTION_FREEZE = 1; // 冻结可用余额
  ASSET_INSTRUCTION_ACTION_DEDUCT_FROZEN = 2; // 消费订单冻结
  ASSET_INSTRUCTION_ACTION_RELEASE_FROZEN = 3; // 释放订单冻结
  ASSET_INSTRUCTION_ACTION_CREDIT_AVAILABLE = 4; // 增加可用余额
  ASSET_INSTRUCTION_ACTION_DEBIT_AVAILABLE = 5; // 扣减可用余额
}

enum AssetInstructionStatus {
  ASSET_INSTRUCTION_STATUS_UNKNOWN = 0;
  ASSET_INSTRUCTION_STATUS_PENDING = 1; // 待执行
  ASSET_INSTRUCTION_STATUS_PROCESSING = 2; // 执行中
  ASSET_INSTRUCTION_STATUS_SUCCESS = 3; // 执行成功
  ASSET_INSTRUCTION_STATUS_FAILED = 4; // 等待重试
  ASSET_INSTRUCTION_STATUS_MANUAL_REVIEW = 5; // 人工处理
  ASSET_INSTRUCTION_STATUS_CANCELED = 6; // 尚未执行即取消
}

enum AssetReconciliationStatus {
  ASSET_RECONCILIATION_STATUS_UNKNOWN = 0;
  ASSET_RECONCILIATION_STATUS_PENDING = 1;
  ASSET_RECONCILIATION_STATUS_MATCHED = 2;
  ASSET_RECONCILIATION_STATUS_MISMATCH = 3;
}

enum ReconciliationCheckType {
  RECONCILIATION_CHECK_TYPE_UNKNOWN = 0;
  RECONCILIATION_CHECK_TYPE_ASSET_FLOW = 1;
  RECONCILIATION_CHECK_TYPE_BALANCE_MIRROR = 2;
  RECONCILIATION_CHECK_TYPE_SETTLEMENT_BALANCE = 3;
}

enum ReconciliationIssueStatus {
  RECONCILIATION_ISSUE_STATUS_UNKNOWN = 0;
  RECONCILIATION_ISSUE_STATUS_OPEN = 1;
  RECONCILIATION_ISSUE_STATUS_RESOLVED = 2;
  RECONCILIATION_ISSUE_STATUS_IGNORED = 3;
}

enum PositionStatus {
  POSITION_STATUS_UNKNOWN = 0;
  POSITION_STATUS_HOLDING = 1; // 持仓中
  POSITION_STATUS_CLOSED = 2; // 已平仓
  POSITION_STATUS_EXERCISED = 3; // 已行权
  POSITION_STATUS_EXPIRED = 4; // 已到期
  POSITION_STATUS_SETTLED = 5; // 已结算
}

enum ExerciseType {
  EXERCISE_TYPE_UNKNOWN = 0;
  EXERCISE_TYPE_USER = 1; // 用户主动
  EXERCISE_TYPE_AUTO = 2; // 系统自动
}

enum ExerciseStatus {
  EXERCISE_STATUS_UNKNOWN = 0;
  EXERCISE_STATUS_PENDING = 1;
  EXERCISE_STATUS_DONE = 2;
  EXERCISE_STATUS_REJECTED = 3;
  EXERCISE_STATUS_CANCELED = 4;
}

enum ExerciseAssignmentStatus {
  EXERCISE_ASSIGNMENT_STATUS_UNKNOWN = 0;
  EXERCISE_ASSIGNMENT_STATUS_PENDING = 1;
  EXERCISE_ASSIGNMENT_STATUS_DONE = 2;
  EXERCISE_ASSIGNMENT_STATUS_FAILED = 3;
  EXERCISE_ASSIGNMENT_STATUS_MANUAL_REVIEW = 4;
}

enum SettlementStatus {
  SETTLEMENT_STATUS_UNKNOWN = 0;
  SETTLEMENT_STATUS_PENDING = 1;
  SETTLEMENT_STATUS_PROCESSING = 2;
  SETTLEMENT_STATUS_DONE = 3;
  SETTLEMENT_STATUS_FAILED = 4;
}

enum SettlementPriceStatus {
  SETTLEMENT_PRICE_STATUS_UNKNOWN = 0;
  SETTLEMENT_PRICE_STATUS_PENDING = 1; // 等待有效价格
  SETTLEMENT_PRICE_STATUS_CONFIRMED = 2; // 已锁定，不可变
  SETTLEMENT_PRICE_STATUS_REJECTED = 3; // 价格被拒绝
}

enum SettlementBatchStatus {
  SETTLEMENT_BATCH_STATUS_UNKNOWN = 0;
  SETTLEMENT_BATCH_STATUS_WAITING_PRICE = 1;
  SETTLEMENT_BATCH_STATUS_PRICE_LOCKED = 2;
  SETTLEMENT_BATCH_STATUS_CALCULATING = 3;
  SETTLEMENT_BATCH_STATUS_INSTRUCTIONS_CREATED = 4;
  SETTLEMENT_BATCH_STATUS_ASSET_PROCESSING = 5;
  SETTLEMENT_BATCH_STATUS_RECONCILING = 6;
  SETTLEMENT_BATCH_STATUS_DONE = 7;
  SETTLEMENT_BATCH_STATUS_FAILED = 8;
}

enum SettlementDetailDirection {
  SETTLEMENT_DETAIL_DIRECTION_UNKNOWN = 0;
  SETTLEMENT_DETAIL_DIRECTION_CREDIT = 1; // 多头应收
  SETTLEMENT_DETAIL_DIRECTION_DEBIT = 2; // 空头应付
  SETTLEMENT_DETAIL_DIRECTION_ABANDON = 3; // 价外放弃
}

enum OptionEventType {
  OPTION_EVENT_TYPE_UNKNOWN = 0;
  OPTION_EVENT_TYPE_TRADE_POSITION = 1;
}

enum OptionEventStatus {
  OPTION_EVENT_STATUS_UNKNOWN = 0;
  OPTION_EVENT_STATUS_PENDING = 1;
  OPTION_EVENT_STATUS_PROCESSING = 2;
  OPTION_EVENT_STATUS_SUCCESS = 3;
  OPTION_EVENT_STATUS_FAILED = 4;
  OPTION_EVENT_STATUS_MANUAL_REVIEW = 5;
}

enum OptionInboxStatus {
  OPTION_INBOX_STATUS_UNKNOWN = 0;
  OPTION_INBOX_STATUS_PROCESSING = 1;
  OPTION_INBOX_STATUS_SUCCESS = 2;
  OPTION_INBOX_STATUS_FAILED = 3;
}

enum SellerMarginMode {
  SELLER_MARGIN_MODE_UNKNOWN = 0;
  SELLER_MARGIN_MODE_DISABLED = 1;
  SELLER_MARGIN_MODE_ISOLATED = 2;
  SELLER_MARGIN_MODE_PORTFOLIO = 3;
  // 实物交割专用：Call 全额冻结标的，Put 全额冻结行权款。
  SELLER_MARGIN_MODE_COVERED_DELIVERY = 4;
}

enum PhysicalDeliveryPolicy {
  PHYSICAL_DELIVERY_POLICY_UNKNOWN = 0;
  // 所有交付方扣款/扣币成功后才执行收款/收币；失败进入重试及人工处理。
  PHYSICAL_DELIVERY_POLICY_STRICT = 1;
}

// 组合保证金风险算法版本。算法版本必须持久化，避免规则升级后无法审计历史快照。
enum PortfolioRiskMethod {
  PORTFOLIO_RISK_METHOD_UNKNOWN = 0;
  // 同标的、同到期日内按价格情景最大损失计算，并叠加裸空头最低保证金。
  PORTFOLIO_RISK_METHOD_EXPIRY_SCENARIO_V1 = 1;
}

// 保险基金不足时的合约级穿仓处置策略。
enum LiquidationDeficitPolicy {
  LIQUIDATION_DEFICIT_POLICY_UNKNOWN = 0;
  LIQUIDATION_DEFICIT_POLICY_MANUAL_REVIEW = 1;
  LIQUIDATION_DEFICIT_POLICY_PLATFORM_BACKSTOP = 2;
}

// 单笔强平最终采用的穿仓资金来源。
enum LiquidationDeficitResolution {
  LIQUIDATION_DEFICIT_RESOLUTION_UNKNOWN = 0;
  LIQUIDATION_DEFICIT_RESOLUTION_NONE = 1;
  LIQUIDATION_DEFICIT_RESOLUTION_INSURANCE_FUND = 2;
  LIQUIDATION_DEFICIT_RESOLUTION_PLATFORM_BACKSTOP = 3;
  LIQUIDATION_DEFICIT_RESOLUTION_INSURANCE_AND_BACKSTOP = 4;
  LIQUIDATION_DEFICIT_RESOLUTION_MANUAL_REVIEW = 5;
}

enum MarginLotStatus {
  MARGIN_LOT_STATUS_UNKNOWN = 0;
  MARGIN_LOT_STATUS_ACTIVE = 1;
  MARGIN_LOT_STATUS_RELEASING = 2;
  MARGIN_LOT_STATUS_CONSUMING = 3;
  MARGIN_LOT_STATUS_RELEASED = 4;
  MARGIN_LOT_STATUS_CONSUMED = 5;
  MARGIN_LOT_STATUS_RESOLVED = 6;
}

enum RiskAccountStatus {
  RISK_ACCOUNT_STATUS_UNKNOWN = 0;
  RISK_ACCOUNT_STATUS_NORMAL = 1;
  RISK_ACCOUNT_STATUS_MARGIN_CALL = 2;
  RISK_ACCOUNT_STATUS_LIQUIDATING = 3;
  RISK_ACCOUNT_STATUS_BANKRUPT = 4;
  RISK_ACCOUNT_STATUS_RESTRICTED = 5;
}

enum LiquidationStatus {
  LIQUIDATION_STATUS_UNKNOWN = 0;
  LIQUIDATION_STATUS_PENDING = 1;
  LIQUIDATION_STATUS_EXECUTING = 2;
  LIQUIDATION_STATUS_DONE = 3;
  LIQUIDATION_STATUS_FAILED = 4;
  LIQUIDATION_STATUS_BANKRUPT = 5;
  LIQUIDATION_STATUS_MANUAL_REVIEW = 6;
}

enum InsuranceFundFlowType {
  INSURANCE_FUND_FLOW_TYPE_UNKNOWN = 0;
  INSURANCE_FUND_FLOW_TYPE_LIQUIDATION_FEE = 1;
  INSURANCE_FUND_FLOW_TYPE_DEFICIT_COVER = 2;
  INSURANCE_FUND_FLOW_TYPE_MANUAL_DEPOSIT = 3;
  INSURANCE_FUND_FLOW_TYPE_MANUAL_WITHDRAW = 4;
}

enum ExerciseResult {
  EXERCISE_RESULT_UNKNOWN = 0;
  EXERCISE_RESULT_NONE = 1; // 未执行
  EXERCISE_RESULT_AUTO_EXERCISE = 2; // 自动行权
  EXERCISE_RESULT_AUTO_ABANDON = 3; // 自动放弃
}

enum AccountStatus {
  ACCOUNT_STATUS_UNKNOWN = 0;
  ACCOUNT_STATUS_NORMAL = 1;
  ACCOUNT_STATUS_FROZEN = 2;
  ACCOUNT_STATUS_RESTRICTED = 3;
}

enum BillRefType {
  BILL_REF_TYPE_UNKNOWN = 0;
  BILL_REF_TYPE_ORDER = 1; // 下单
  BILL_REF_TYPE_TRADE = 2; // 成交
  BILL_REF_TYPE_CANCEL = 3; // 撤单
  BILL_REF_TYPE_EXERCISE = 4; // 行权
  BILL_REF_TYPE_SETTLEMENT = 5; // 结算
  BILL_REF_TYPE_FEE = 6; // 手续费
}
