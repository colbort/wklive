// ====================
// 定时任务
// ====================
service Task {
  // 执行并重试 Option 资产指令
  rpc ProcessAssetInstructions(OptionTaskReq) returns (OptionTaskResp);
  // 按合约撮合序号消费成交持仓事件
  rpc ProcessTradeEvents(OptionTaskReq) returns (OptionTaskResp);
  // 聚合卖方持仓、资产权益与行情，刷新风险账户
  rpc ProcessRiskAccounts(OptionTaskReq) returns (OptionTaskResp);
  // 执行卖方逐仓强平及保险账户接管
  rpc ProcessLiquidations(OptionTaskReq) returns (OptionTaskResp);
  // 处理美式主动行权的空头指派和资金清算
  rpc ProcessExercises(OptionTaskReq) returns (OptionTaskResp);
  // 期权合约生命周期处理（状态流转/订单过期/自动行权/到期结算）
  rpc ProcessContractLifecycle(OptionTaskReq) returns (OptionTaskResp);
  // 按批次执行已复核且到达生效时间的公司行动迁移
  rpc ProcessCorporateActions(OptionTaskReq) returns (OptionTaskResp);
  // 期权行情快照归档/清理
  rpc CleanMarketSnapshots(OptionTaskReq) returns (OptionTaskResp);
}
