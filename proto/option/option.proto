message ListPositionsReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  int64 account_id = 3;
  int64 contract_id = 4;
  common.PositionSide side = 5; // 持仓方向
  PositionStatus status = 6;
  common.PageReq page = 7;
}

message ListPositionsResp {
  common.RespBase base = 1;
  repeated OptionPositionDetail data = 2;
}

message GetExerciseReq {
  int64 tenant_id = 1;
  int64 id = 2;
  string exercise_no = 3;
}

message GetExerciseResp {
  common.RespBase base = 1;
  OptionExerciseDetail data = 2;
}

message ListExercisesReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  int64 account_id = 3;
  int64 contract_id = 4;
  ExerciseType exercise_type = 5;
  ExerciseStatus status = 6;
  common.TimeRange exercise_time_range = 7;
  common.PageReq page = 8;
}

message ListExercisesResp {
  common.RespBase base = 1;
  repeated OptionExerciseDetail data = 2;
}

message GetSettlementReq {
  int64 tenant_id = 1;
  int64 id = 2;
  string settlement_no = 3;
}

message GetSettlementResp {
  common.RespBase base = 1;
  OptionSettlementDetail data = 2;
}

message ListSettlementsReq {
  int64 tenant_id = 1;
  int64 contract_id = 2;
  SettlementStatus status = 3;
  common.TimeRange settlement_time_range = 4;
  common.PageReq page = 5;
}

message ListSettlementsResp {
  common.RespBase base = 1;
  repeated OptionSettlementDetail data = 2;
}

message GetAccountReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  int64 account_id = 3;
  string margin_coin = 4;
}

message GetAccountResp {
  common.RespBase base = 1;
  OptionAccount data = 2;
}

message ListAccountsReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  int64 account_id = 3;
  AccountStatus status = 4;
  common.PageReq page = 5;
}

message ListAccountsResp {
  common.RespBase base = 1;
  repeated OptionAccount data = 2;
}

message GetBillReq {
  int64 tenant_id = 1;
  int64 id = 2;
}

message GetBillResp {
  common.RespBase base = 1;
  OptionBill data = 2;
}

message ListBillsReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  int64 account_id = 3;
  string biz_no = 4;
  BillRefType ref_type = 5;
  common.TimeRange create_time_range = 6;
  common.PageReq page = 7;
}

message ListBillsResp {
  common.RespBase base = 1;
  repeated OptionBill data = 2;
}

message OptionTaskReq {
  int64 tenant_id = 1;
}

message OptionTaskResp {
  common.RespBase base = 1;
}

// ====================
// 定时任务
// ====================
service Task {
  // 执行并重试 Option 资产指令
  rpc ProcessAssetInstructions(OptionTaskReq) returns (OptionTaskResp);
  // 按合约撮合序号消费成交持仓事件
  rpc ProcessTradeEvents(OptionTaskReq) returns (OptionTaskResp);
  // 聚合卖方持仓、资产权益与行情，刷新风险账户
  rpc ProcessRiskAccounts(OptionTaskReq) returns (OptionTaskResp);
  // 执行卖方逐仓强平及保险账户接管
  rpc ProcessLiquidations(OptionTaskReq) returns (OptionTaskResp);
  // 处理美式主动行权的空头指派和资金清算
  rpc ProcessExercises(OptionTaskReq) returns (OptionTaskResp);
  // 期权合约生命周期处理（状态流转/订单过期/自动行权/到期结算）
  rpc ProcessContractLifecycle(OptionTaskReq) returns (OptionTaskResp);
  // 期权行情快照归档/清理
  rpc CleanMarketSnapshots(OptionTaskReq) returns (OptionTaskResp);
}
