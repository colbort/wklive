syntax = "proto3";

package option;

import "proto/common/common.proto";
import "proto/option/enum.proto";
import "proto/option/model.proto";

option go_package = "wklive/proto/option;option";

// 期权 APP 端服务
service App {
  // 获取可交易期权合约列表
  rpc ListContracts(UserListContractsReq) returns (UserListContractsResp);

  // 获取期权合约详情
  rpc GetContractDetail(GetContractDetailReq) returns (GetContractDetailResp);

  // 提交期权下单请求
  rpc PlaceOrder(PlaceOrderReq) returns (PlaceOrderResp);

  // 撤销期权委托订单
  rpc CancelOrder(CancelOrderReq) returns (UserCommonResp);

  // 获取单个委托订单详情
  rpc GetOrderDetail(GetOrderDetailReq) returns (GetOrderDetailResp);

  // 获取当前委托列表
  rpc ListCurrentOrders(ListCurrentOrdersReq) returns (ListCurrentOrdersResp);

  // 获取历史委托列表
  rpc ListHistoryOrders(ListHistoryOrdersReq) returns (ListHistoryOrdersResp);

  // 获取成交记录列表
  rpc ListTrades(UserListTradesReq) returns (UserListTradesResp);

  // 获取持仓列表
  rpc ListPositions(UserListPositionsReq) returns (UserListPositionsResp);

  // 获取单个持仓详情
  rpc GetPositionDetail(GetPositionDetailReq) returns (GetPositionDetailResp);

  // 发起行权
  rpc Exercise(ExerciseReq) returns (ExerciseResp);

  // 获取行权记录列表
  rpc ListExercises(UserListExercisesReq) returns (UserListExercisesResp);

  // 获取账户资产列表
  rpc ListAccounts(UserListAccountsReq) returns (UserListAccountsResp);

  // 获取资金流水列表
  rpc ListBills(UserListBillsReq) returns (UserListBillsResp);
}

message UserCommonResp {
  common.RespBase base = 1;
}

message UserListContractsReq {
  string underlying_symbol = 1;
  OptionType option_type = 2;
  ContractStatus status = 3;
  common.PageReq page = 4;
}

message UserListContractsResp {
  common.RespBase base = 1;
  repeated OptionContractDetail data = 2;
}

message GetContractDetailReq {
  int64 contract_id = 1;
}

message GetContractDetailResp {
  common.RespBase base = 1;
  OptionContractDetail data = 2;
}

message PlaceOrderReq {
  int64 account_id = 1;
  int64 contract_id = 2;
  common.Side side = 3; // 买卖方向
  PositionEffect position_effect = 4;
  OrderType order_type = 5;
  string price = 6;
  string qty = 7;
  string client_order_id = 8;
  common.YesNo reduce_only = 9; // 是否只减仓
  common.YesNo mmp = 10; // 是否做市商保护单
  // 市价保护单的最差成交价。MARKET 必填；其他订单类型不得填写。
  string protection_price = 11;
  // 市价买入开仓允许消费的最大结算币金额。MARKET 买入开仓必填。
  string max_turnover = 12;
}

message PlaceOrderResp {
  common.RespBase base = 1;
  PlaceOrderData data = 2;
}

message PlaceOrderData {
  string order_no = 1;
  int64 order_id = 2;
}

message CancelOrderReq {
  int64 account_id = 1;
  int64 order_id = 2;
  string order_no = 3;
}

message GetOrderDetailReq {
  int64 account_id = 1;
  int64 order_id = 2;
  string order_no = 3;
}

message GetOrderDetailResp {
  common.RespBase base = 1;
  OptionOrderDetail data = 2;
}

message ListCurrentOrdersReq {
  int64 account_id = 1;
  int64 contract_id = 2;
  common.Side side = 3; // 买卖方向
  common.PageReq page = 4;
}

message ListCurrentOrdersResp {
  common.RespBase base = 1;
  repeated OptionOrderDetail data = 2;
}

message ListHistoryOrdersReq {
  int64 account_id = 1;
  int64 contract_id = 2;
  OrderStatus status = 3;
  common.TimeRange create_time_range = 4;
  common.PageReq page = 5;
}

message ListHistoryOrdersResp {
  common.RespBase base = 1;
  repeated OptionOrderDetail data = 2;
}

message UserListTradesReq {
  int64 account_id = 1;
  int64 contract_id = 2;
  common.TimeRange trade_time_range = 3;
  common.PageReq page = 4;
}

message UserListTradesResp {
  common.RespBase base = 1;
  repeated OptionTradeDetail data = 2;
}

message UserListPositionsReq {
  int64 account_id = 1;
  PositionStatus status = 2;
  common.PageReq page = 3;
}

message UserListPositionsResp {
  common.RespBase base = 1;
  repeated OptionPositionDetail data = 2;
}

message GetPositionDetailReq {
  int64 account_id = 1;
  int64 position_id = 2;
}

message GetPositionDetailResp {
  common.RespBase base = 1;
  OptionPositionDetail data = 2;
}

message ExerciseReq {
  int64 account_id = 1;
  int64 position_id = 2;
  int64 contract_id = 3;
  string exercise_qty = 4;
}

message ExerciseResp {
  common.RespBase base = 1;
  ExerciseData data = 2;
}

message ExerciseData {
  string exercise_no = 1;
  int64 exercise_id = 2;
}

message UserListExercisesReq {
  int64 account_id = 1;
  int64 contract_id = 2;
  ExerciseStatus status = 3;
  common.TimeRange exercise_time_range = 4;
  common.PageReq page = 5;
}

message UserListExercisesResp {
  common.RespBase base = 1;
  repeated OptionExerciseDetail data = 2;
}

message UserListAccountsReq {
  int64 account_id = 1;
}

message UserListAccountsResp {
  common.RespBase base = 1;
  repeated OptionAccount data = 2;
}

message UserListBillsReq {
  int64 account_id = 1;
  BillRefType ref_type = 2;
  common.TimeRange create_time_range = 3;
  common.PageReq page = 4;
}

message UserListBillsResp {
  common.RespBase base = 1;
  repeated OptionBill data = 2;
}

// 期权管理后台服务
service Admin {
  // 创建期权合约
  rpc CreateContract(CreateContractReq) returns (CreateContractResp);

  // 更新期权合约
  rpc UpdateContract(UpdateContractReq) returns (CommonResp);

  // 获取单个期权合约详情
  rpc GetContract(GetContractReq) returns (GetContractResp);

  // 分页查询期权合约列表
  rpc ListContracts(ListContractsReq) returns (ListContractsResp);

  // 更新期权行情数据
  rpc UpdateMarket(UpdateMarketReq) returns (CommonResp);

  // 获取单个期权当前行情
  rpc GetMarket(GetMarketReq) returns (GetMarketResp);

  // 分页查询期权行情快照列表
  rpc ListMarketSnapshots(ListMarketSnapshotsReq) returns (ListMarketSnapshotsResp);

  // 获取单个委托订单详情
  rpc GetOrder(GetOrderReq) returns (GetOrderResp);

  // 分页查询委托订单列表
  rpc ListOrders(ListOrdersReq) returns (ListOrdersResp);

  // 获取单个成交记录详情
  rpc GetTrade(GetTradeReq) returns (GetTradeResp);

  // 分页查询成交记录列表
  rpc ListTrades(ListTradesReq) returns (ListTradesResp);

  // 获取单个持仓详情
  rpc GetPosition(GetPositionReq) returns (GetPositionResp);

  // 分页查询持仓列表
  rpc ListPositions(ListPositionsReq) returns (ListPositionsResp);

  // 获取单个行权记录详情
  rpc GetExercise(GetExerciseReq) returns (GetExerciseResp);

  // 分页查询行权记录列表
  rpc ListExercises(ListExercisesReq) returns (ListExercisesResp);

  // 获取单个到期结算记录详情
  rpc GetSettlement(GetSettlementReq) returns (GetSettlementResp);

  // 分页查询到期结算记录列表
  rpc ListSettlements(ListSettlementsReq) returns (ListSettlementsResp);

  // 获取单个账户资产详情
  rpc GetAccount(GetAccountReq) returns (GetAccountResp);

  // 分页查询账户资产列表
  rpc ListAccounts(ListAccountsReq) returns (ListAccountsResp);

  // 获取单个资金流水详情
  rpc GetBill(GetBillReq) returns (GetBillResp);

  // 分页查询资金流水列表
  rpc ListBills(ListBillsReq) returns (ListBillsResp);

  // 暂停合约后强制撤销全部活动订单
  rpc ForceCancelContractOrders(ForceCancelContractOrdersReq) returns (CommonResp);

  // 将失败或人工处理的资产指令重新置为待执行
  rpc RetryAssetInstruction(RetryAssetInstructionReq) returns (CommonResp);

  // 将失败或人工处理的成交持仓事件重新置为待执行
  rpc RetryTradeEvent(RetryTradeEventReq) returns (CommonResp);

  // 分页查询卖方风险账户
  rpc ListRiskAccounts(ListRiskAccountsReq) returns (ListRiskAccountsResp);

  // 分页查询强平记录
  rpc ListLiquidations(ListLiquidationsReq) returns (ListLiquidationsResp);

  // 将失败或人工处理的强平记录重新置为待执行
  rpc RetryLiquidation(RetryLiquidationReq) returns (CommonResp);

  // 按行权单重试失败或人工处理的资产指令
  rpc RetryExercise(RetryExerciseReq) returns (CommonResp);
}

message CommonResp {
  common.RespBase base = 1;
}

message ForceCancelContractOrdersReq {
  int64 tenant_id = 1;
  int64 contract_id = 2;
  string reason = 3;
}

message RetryAssetInstructionReq {
  int64 tenant_id = 1;
  int64 instruction_id = 2;
}

message RetryTradeEventReq {
  int64 tenant_id = 1;
  int64 event_id = 2;
}

message ListRiskAccountsReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  int64 account_id = 3;
  string settle_coin = 4;
  RiskAccountStatus status = 5;
  common.PageReq page = 6;
}

message ListRiskAccountsResp {
  common.RespBase base = 1;
  repeated OptionRiskAccount data = 2;
}

message ListLiquidationsReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  int64 account_id = 3;
  int64 contract_id = 4;
  int64 position_id = 5;
  LiquidationStatus status = 6;
  common.PageReq page = 7;
}

message ListLiquidationsResp {
  common.RespBase base = 1;
  repeated OptionLiquidation data = 2;
}

message RetryLiquidationReq {
  int64 tenant_id = 1;
  int64 liquidation_id = 2;
}

message RetryExerciseReq {
  int64 tenant_id = 1;
  int64 exercise_id = 2;
}

message CreateContractReq {
  int64 tenant_id = 1;
  string contract_code = 2;
  string underlying_symbol = 3;
  string settle_coin = 4;
  string quote_coin = 5;
  OptionType option_type = 6;
  ExerciseStyle exercise_style = 7;
  SettlementType settlement_type = 8;
  string strike_price = 9;
  string contract_unit = 10;
  string min_order_qty = 11;
  string max_order_qty = 12;
  string price_tick = 13;
  string qty_step = 14;
  string multiplier = 15;
  int64 list_time = 16;
  int64 expire_time = 17;
  int64 deliver_time = 18;
  common.YesNo is_auto_exercise = 19; // 是否自动行权
  ContractStatus status = 20;
  int64 sort = 21;
  string remark = 22;
  string maker_fee_rate = 23;
  string taker_fee_rate = 24;
  string exercise_fee_rate = 25;
  int64 fee_user_id = 26;
  int64 fee_account_id = 27;
  SellerMarginMode seller_margin_mode = 28;
  string initial_margin_rate = 29;
  string maintenance_margin_rate = 30;
  string min_margin_rate = 31;
  string liquidation_fee_rate = 32;
  int64 insurance_user_id = 33;
  int64 insurance_account_id = 34;
}

message CreateContractResp {
  int64 id = 1;
  common.RespBase base = 2;
}

message UpdateContractReq {
  int64 id = 1;
  int64 tenant_id = 2;
  string contract_code = 3;
  string underlying_symbol = 4;
  string settle_coin = 5;
  string quote_coin = 6;
  OptionType option_type = 7;
  ExerciseStyle exercise_style = 8;
  SettlementType settlement_type = 9;
  string strike_price = 10;
  string contract_unit = 11;
  string min_order_qty = 12;
  string max_order_qty = 13;
  string price_tick = 14;
  string qty_step = 15;
  string multiplier = 16;
  int64 list_time = 17;
  int64 expire_time = 18;
  int64 deliver_time = 19;
  common.YesNo is_auto_exercise = 20; // 是否自动行权
  ContractStatus status = 21;
  int64 sort = 22;
  string remark = 23;
  common.YesNo is_deleted = 24; // 是否删除
  string maker_fee_rate = 25;
  string taker_fee_rate = 26;
  string exercise_fee_rate = 27;
  int64 fee_user_id = 28;
  int64 fee_account_id = 29;
  SellerMarginMode seller_margin_mode = 30;
  string initial_margin_rate = 31;
  string maintenance_margin_rate = 32;
  string min_margin_rate = 33;
  string liquidation_fee_rate = 34;
  int64 insurance_user_id = 35;
  int64 insurance_account_id = 36;
}

message GetContractReq {
  int64 tenant_id = 1;
  int64 id = 2;
  string contract_code = 3;
}

message GetContractResp {
  common.RespBase base = 1;
  OptionContractDetail data = 2;
}

message ListContractsReq {
  int64 tenant_id = 1;
  string contract_code = 2;
  string underlying_symbol = 3;
  OptionType option_type = 4;
  ContractStatus status = 5;
  common.TimeRange list_time_range = 6;
  common.TimeRange expire_time_range = 7;
  common.PageReq page = 8;
}

message ListContractsResp {
  common.RespBase base = 1;
  repeated OptionContractDetail data = 2;
}

message UpdateMarketReq {
  int64 tenant_id = 1;
  int64 contract_id = 2;
  string underlying_price = 3;
  string mark_price = 4;
  string last_price = 5;
  string bid_price = 6;
  string ask_price = 7;
  string theoretical_price = 8;
  string intrinsic_value = 9;
  string time_value = 10;
  string iv = 11;
  string delta = 12;
  string gamma = 13;
  string theta = 14;
  string vega = 15;
  string rho = 16;
  string risk_free_rate = 17;
  string pricing_model = 18;
  int64 snapshot_time = 19;
}

message GetMarketReq {
  int64 tenant_id = 1;
  int64 contract_id = 2;
}

message GetMarketResp {
  common.RespBase base = 1;
  OptionMarket data = 2;
}

message ListMarketSnapshotsReq {
  int64 tenant_id = 1;
  int64 contract_id = 2;
  common.TimeRange time_range = 3;
  common.PageReq page = 4;
}

message ListMarketSnapshotsResp {
  common.RespBase base = 1;
  repeated OptionMarketSnapshot data = 2;
}

message GetOrderReq {
  int64 tenant_id = 1;
  int64 id = 2;
  string order_no = 3;
}

message GetOrderResp {
  common.RespBase base = 1;
  OptionOrderDetail data = 2;
}

message ListOrdersReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  int64 account_id = 3;
  int64 contract_id = 4;
  string underlying_symbol = 5;
  string order_no = 6;
  common.Side side = 7; // 买卖方向
  PositionEffect position_effect = 8;
  OrderType order_type = 9;
  OrderStatus status = 10;
  common.TimeRange create_time_range = 11;
  common.PageReq page = 12;
}

message ListOrdersResp {
  common.RespBase base = 1;
  repeated OptionOrderDetail data = 2;
}

message GetTradeReq {
  int64 tenant_id = 1;
  int64 id = 2;
  string trade_no = 3;
}

message GetTradeResp {
  common.RespBase base = 1;
  OptionTradeDetail data = 2;
}

message ListTradesReq {
  int64 tenant_id = 1;
  int64 contract_id = 2;
  int64 user_id = 3;
  string trade_no = 4;
  common.TimeRange trade_time_range = 5;
  common.PageReq page = 6;
}

message ListTradesResp {
  common.RespBase base = 1;
  repeated OptionTradeDetail data = 2;
}

message GetPositionReq {
  int64 tenant_id = 1;
  int64 id = 2;
}

message GetPositionResp {
