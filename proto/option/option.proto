syntax = "proto3";

package option;

import "proto/common/common.proto";
import "proto/option/enum.proto";
import "proto/option/model.proto";

option go_package = "wklive/proto/option;option";

// 期权 APP 端服务
service App {
  // 获取可交易期权合约列表
  rpc ListContracts(UserListContractsReq) returns (UserListContractsResp);

  // 获取期权合约详情
  rpc GetContractDetail(GetContractDetailReq) returns (GetContractDetailResp);

  // 按标的和精确到期时间获取期权链、24小时成交统计及未平仓量
  rpc ListOptionChain(ListOptionChainReq) returns (ListOptionChainResp);

  // 获取来自 Option 活动限价委托的聚合盘口
  rpc GetOrderBook(GetOrderBookReq) returns (GetOrderBookResp);

  // 创建2至4腿独立策略簿组合订单
  rpc PlaceComboOrder(PlaceComboOrderReq) returns (PlaceComboOrderResp);

  // 原子撤销未完成组合订单并释放各腿冻结
  rpc CancelComboOrder(CancelComboOrderReq) returns (UserCommonResp);

  // 获取组合订单及不可变腿
  rpc GetComboOrder(GetComboOrderReq) returns (GetComboOrderResp);

  // 查询当前用户组合订单
  rpc ListComboOrders(ListComboOrdersReq) returns (ListComboOrdersResp);

  // 提交期权下单请求
  rpc PlaceOrder(PlaceOrderReq) returns (PlaceOrderResp);

  // 撤销期权委托订单
  rpc CancelOrder(CancelOrderReq) returns (UserCommonResp);

  // 获取单个委托订单详情
  rpc GetOrderDetail(GetOrderDetailReq) returns (GetOrderDetailResp);

  // 获取当前委托列表
  rpc ListCurrentOrders(ListCurrentOrdersReq) returns (ListCurrentOrdersResp);

  // 获取历史委托列表
  rpc ListHistoryOrders(ListHistoryOrdersReq) returns (ListHistoryOrdersResp);

  // 获取成交记录列表
  rpc ListTrades(UserListTradesReq) returns (UserListTradesResp);

  // 获取持仓列表
  rpc ListPositions(UserListPositionsReq) returns (UserListPositionsResp);

  // 获取单个持仓详情
  rpc GetPositionDetail(GetPositionDetailReq) returns (GetPositionDetailResp);

  // 发起行权
  rpc Exercise(ExerciseReq) returns (ExerciseResp);

  // 设置到期行权指令；截止时间前可用新幂等号产生新版本
  rpc SetExerciseInstruction(SetExerciseInstructionReq) returns (GetExerciseInstructionResp);

  // 获取持仓当前生效的到期行权指令
  rpc GetExerciseInstruction(GetExerciseInstructionReq) returns (GetExerciseInstructionResp);

  // 查询当前用户 kill switch
  rpc GetUserTradingControl(GetUserTradingControlReq) returns (GetUserTradingControlResp);

  // 激活用户 kill switch；立即阻止新单并撤销全部活动订单
  rpc ActivateKillSwitch(ActivateKillSwitchReq) returns (GetUserTradingControlResp);

  // 查询当前用户指定做市报价组的 MMP 状态
  rpc GetMMPConfig(GetMMPConfigReq) returns (GetMMPConfigResp);

  // 获取行权记录列表
  rpc ListExercises(UserListExercisesReq) returns (UserListExercisesResp);

  // 获取账户资产列表
  rpc ListAccounts(UserListAccountsReq) returns (UserListAccountsResp);

  // 获取资金流水列表
  rpc ListBills(UserListBillsReq) returns (UserListBillsResp);
}

message UserCommonResp {
  common.RespBase base = 1;
}

message UserListContractsReq {
  string underlying_symbol = 1;
  OptionType option_type = 2;
  ContractStatus status = 3;
  common.PageReq page = 4;
}

message UserListContractsResp {
  common.RespBase base = 1;
  repeated OptionContractDetail data = 2;
}

message GetContractDetailReq {
  int64 contract_id = 1;
}

message GetContractDetailResp {
  common.RespBase base = 1;
  OptionContractDetail data = 2;
}

message ListOptionChainReq {
  string underlying_symbol = 1;
  int64 expire_time = 2;
  ContractStatus status = 3;
}

message ListOptionChainResp {
  common.RespBase base = 1;
  repeated OptionChainRow data = 2;
  int64 generated_at = 3;
  int64 statistics_window_start = 4;
}

message GetOrderBookReq {
  int64 contract_id = 1;
  int32 depth_limit = 2;
}

message GetOrderBookResp {
  common.RespBase base = 1;
  OptionOrderBook data = 2;
}

message ComboOrderLegInput {
  int64 contract_id = 1;
  common.Side side = 2;
  PositionEffect position_effect = 3;
  int64 ratio = 4;
  string price = 5;
}

message PlaceComboOrderReq {
  int64 account_id = 1;
  string client_combo_id = 2;
  ComboOrderType order_type = 3;
  string qty = 4;
  string net_price = 5;
  repeated ComboOrderLegInput legs = 6;
}

message PlaceComboOrderResp {
  common.RespBase base = 1;
  OptionComboOrderDetail data = 2;
}

message CancelComboOrderReq {
  int64 account_id = 1;
  int64 combo_order_id = 2;
  string combo_no = 3;
}

message GetComboOrderReq {
  int64 account_id = 1;
  int64 combo_order_id = 2;
  string combo_no = 3;
}

message GetComboOrderResp {
  common.RespBase base = 1;
  OptionComboOrderDetail data = 2;
}

message ListComboOrdersReq {
  int64 account_id = 1;
  ComboOrderStatus status = 2;
  common.PageReq page = 3;
}

message ListComboOrdersResp {
  common.RespBase base = 1;
  repeated OptionComboOrderDetail data = 2;
}

message PlaceOrderReq {
  int64 account_id = 1; // 策略/归属维度，不代表独立资金池
  int64 contract_id = 2;
  common.Side side = 3; // 买卖方向
  PositionEffect position_effect = 4;
  OrderType order_type = 5;
  string price = 6;
  string qty = 7;
  string client_order_id = 8;
  common.YesNo reduce_only = 9; // 是否只减仓
  common.YesNo mmp = 10; // 是否做市商保护单
  // 市价保护单的最差成交价。MARKET 必填；其他订单类型不得填写。
  string protection_price = 11;
  // 市价买入开仓允许消费的最大结算币金额。MARKET 买入开仓必填。
  string max_turnover = 12;
  // MMP 报价组。mmp=YES 时必填，且仅允许 POST_ONLY。
  string mmp_group = 13;
}

message PlaceOrderResp {
  common.RespBase base = 1;
  PlaceOrderData data = 2;
}

message PlaceOrderData {
  string order_no = 1;
  int64 order_id = 2;
}

message CancelOrderReq {
  int64 account_id = 1;
  int64 order_id = 2;
  string order_no = 3;
}

message GetOrderDetailReq {
  int64 account_id = 1;
  int64 order_id = 2;
  string order_no = 3;
}

message GetOrderDetailResp {
  common.RespBase base = 1;
  OptionOrderDetail data = 2;
}

message ListCurrentOrdersReq {
  int64 account_id = 1;
  int64 contract_id = 2;
  common.Side side = 3; // 买卖方向
  common.PageReq page = 4;
}

message ListCurrentOrdersResp {
  common.RespBase base = 1;
  repeated OptionOrderDetail data = 2;
}

message ListHistoryOrdersReq {
  int64 account_id = 1;
  int64 contract_id = 2;
  OrderStatus status = 3;
  common.TimeRange create_time_range = 4;
  common.PageReq page = 5;
}

message ListHistoryOrdersResp {
  common.RespBase base = 1;
  repeated OptionOrderDetail data = 2;
}

message UserListTradesReq {
  int64 account_id = 1;
  int64 contract_id = 2;
  common.TimeRange trade_time_range = 3;
  common.PageReq page = 4;
}

message UserListTradesResp {
  common.RespBase base = 1;
  repeated OptionTradeDetail data = 2;
}

message UserListPositionsReq {
  int64 account_id = 1;
  PositionStatus status = 2;
  common.PageReq page = 3;
}

message UserListPositionsResp {
  common.RespBase base = 1;
  repeated OptionPositionDetail data = 2;
}

message GetPositionDetailReq {
  int64 account_id = 1;
  int64 position_id = 2;
}

message GetPositionDetailResp {
  common.RespBase base = 1;
  OptionPositionDetail data = 2;
}

message ExerciseReq {
  int64 account_id = 1;
  int64 position_id = 2;
  int64 contract_id = 3;
  string exercise_qty = 4;
  string client_exercise_id = 5;
}

message ExerciseResp {
  common.RespBase base = 1;
  ExerciseData data = 2;
}

message ExerciseData {
  string exercise_no = 1;
  int64 exercise_id = 2;
}

message SetExerciseInstructionReq {
  int64 account_id = 1;
  int64 position_id = 2;
  int64 contract_id = 3;
  ExerciseInstructionType instruction_type = 4;
  string client_instruction_id = 5;
}

message GetExerciseInstructionReq {
  int64 account_id = 1;
  int64 position_id = 2;
}

message GetExerciseInstructionResp {
  common.RespBase base = 1;
  OptionExerciseInstruction data = 2;
}

message GetUserTradingControlReq {}

message GetUserTradingControlResp {
  common.RespBase base = 1;
  OptionUserTradingControl data = 2;
}

message GetMMPConfigReq {
  int64 contract_id = 1;
  string group_code = 2;
}

message GetMMPConfigResp {
  common.RespBase base = 1;
  OptionMMPConfig data = 2;
}

message ActivateKillSwitchReq {
  string reason = 1;
}

message UserListExercisesReq {
  int64 account_id = 1;
  int64 contract_id = 2;
  ExerciseStatus status = 3;
  common.TimeRange exercise_time_range = 4;
  common.PageReq page = 5;
}

message UserListExercisesResp {
  common.RespBase base = 1;
  repeated OptionExerciseDetail data = 2;
}

message UserListAccountsReq {
  int64 account_id = 1;
}

message UserListAccountsResp {
  common.RespBase base = 1;
  repeated OptionAccount data = 2;
}

message UserListBillsReq {
  int64 account_id = 1;
  BillRefType ref_type = 2;
  common.TimeRange create_time_range = 3;
  common.PageReq page = 4;
}

message UserListBillsResp {
  common.RespBase base = 1;
  repeated OptionBill data = 2;
}

// 期权管理后台服务
service Admin {
  // 创建期权合约
  rpc CreateContract(CreateContractReq) returns (CreateContractResp);

  // 更新期权合约
  rpc UpdateContract(UpdateContractReq) returns (CommonResp);

  // 获取单个期权合约详情
  rpc GetContract(GetContractReq) returns (GetContractResp);

  // 分页查询期权合约列表
  rpc ListContracts(ListContractsReq) returns (ListContractsResp);

  // 更新期权行情数据
  rpc UpdateMarket(UpdateMarketReq) returns (CommonResp);

  // 获取单个期权当前行情
  rpc GetMarket(GetMarketReq) returns (GetMarketResp);

  // 分页查询期权行情快照列表
  rpc ListMarketSnapshots(ListMarketSnapshotsReq) returns (ListMarketSnapshotsResp);

  // 获取单个委托订单详情
  rpc GetOrder(GetOrderReq) returns (GetOrderResp);

  // 分页查询委托订单列表
  rpc ListOrders(ListOrdersReq) returns (ListOrdersResp);

  // 分页查询组合父单，供运营按整组处理
  rpc ListAdminComboOrders(ListAdminComboOrdersReq) returns (ListAdminComboOrdersResp);

  // 查询组合父单、腿、影子单、成交和资产指令
  rpc GetAdminComboOrder(GetAdminComboOrderReq) returns (GetAdminComboOrderResp);

  // 强制撤销一个组合父单；禁止单腿撤销
  rpc ForceCancelComboOrder(ForceCancelComboOrderReq) returns (CommonResp);

  // 获取单个成交记录详情
  rpc GetTrade(GetTradeReq) returns (GetTradeResp);

  // 分页查询成交记录列表
  rpc ListTrades(ListTradesReq) returns (ListTradesResp);

  // 获取单个持仓详情
  rpc GetPosition(GetPositionReq) returns (GetPositionResp);

  // 分页查询持仓列表
  rpc ListPositions(ListPositionsReq) returns (ListPositionsResp);

  // 获取单个行权记录详情
  rpc GetExercise(GetExerciseReq) returns (GetExerciseResp);

  // 分页查询行权记录列表
  rpc ListExercises(ListExercisesReq) returns (ListExercisesResp);

  // 获取单个到期结算记录详情
  rpc GetSettlement(GetSettlementReq) returns (GetSettlementResp);

  // 分页查询到期结算记录列表
  rpc ListSettlements(ListSettlementsReq) returns (ListSettlementsResp);

  // 分页查询到期结算价版本
  rpc ListSettlementPrices(ListSettlementPricesReq) returns (ListSettlementPricesResp);

  // 创建人工结算价更正草案，必须由另一管理员确认
  rpc CreateSettlementPriceCorrection(CreateSettlementPriceCorrectionReq) returns (GetSettlementPriceResp);

  // 确认或拒绝待复核结算价
  rpc ReviewSettlementPrice(ReviewSettlementPriceReq) returns (GetSettlementPriceResp);

  // 获取单个账户资产详情
  rpc GetAccount(GetAccountReq) returns (GetAccountResp);

  // 分页查询账户资产列表
  rpc ListAccounts(ListAccountsReq) returns (ListAccountsResp);

  // 获取单个资金流水详情
  rpc GetBill(GetBillReq) returns (GetBillResp);

  // 分页查询资金流水列表
  rpc ListBills(ListBillsReq) returns (ListBillsResp);

  // 暂停合约后强制撤销全部活动订单
  rpc ForceCancelContractOrders(ForceCancelContractOrdersReq) returns (CommonResp);

  // 将失败或人工处理的资产指令重新置为待执行
  rpc RetryAssetInstruction(RetryAssetInstructionReq) returns (CommonResp);

  // 查询运营异常和任务水位汇总
  rpc GetOperationsOverview(GetOperationsOverviewReq) returns (GetOperationsOverviewResp);

  // 分页查询资产指令，统一定位失败和人工处理项
  rpc ListAssetInstructions(ListAssetInstructionsReq) returns (ListAssetInstructionsResp);

  // 分页查询 Option 与 Asset 对账差异
  rpc ListReconciliationIssues(ListReconciliationIssuesReq) returns (ListReconciliationIssuesResp);

  // 创建不可覆盖的交易日历版本草案
  rpc CreateTradingCalendar(CreateTradingCalendarReq) returns (GetTradingCalendarResp);

  // 由独立管理员批准或拒绝日历版本
  rpc ReviewTradingCalendar(ReviewTradingCalendarReq) returns (GetTradingCalendarResp);

  // 分页查询交易日历版本
  rpc ListTradingCalendars(ListTradingCalendarsReq) returns (ListTradingCalendarsResp);

  // 紧急暂停合约交易并撤销活动订单
  rpc HaltContractTrading(HaltContractTradingReq) returns (GetTradingHaltResp);

  // 引用原 halt 解除临时休市
  rpc ResumeContractTrading(ResumeContractTradingReq) returns (GetTradingHaltResp);

  // 分页查询临时休市记录
  rpc ListTradingHalts(ListTradingHaltsReq) returns (ListTradingHaltsResp);

  // 登记不可覆盖的公司行动版本；所有受影响合约立即停牌并撤单
  rpc CreateCorporateAction(CreateCorporateActionReq) returns (GetCorporateActionResp);

  // 独立管理员复核公司行动；不支持的事件只能进入人工处理
  rpc ReviewCorporateAction(ReviewCorporateActionReq) returns (GetCorporateActionResp);

  // 分页查询公司行动及合约迁移进度
  rpc ListCorporateActions(ListCorporateActionsReq) returns (ListCorporateActionsResp);

  // 分页查询逐持仓迁移审计结果
  rpc ListCorporateActionPositions(ListCorporateActionPositionsReq) returns (ListCorporateActionPositionsResp);

  // 创建不可覆盖的到期/行权价系列版本草案
  rpc CreateContractSeries(CreateContractSeriesReq) returns (GetContractSeriesResp);

  // 独立管理员复核；批准时原子生成全部 PENDING 合约
  rpc ReviewContractSeries(ReviewContractSeriesReq) returns (GetContractSeriesResp);

  // 分页查询系列版本
  rpc ListContractSeries(ListContractSeriesReq) returns (ListContractSeriesResp);

  // 分页查询系列生成合约谱系
  rpc ListContractSeriesDetails(ListContractSeriesDetailsReq) returns (ListContractSeriesDetailsResp);

  // 对已生成系列执行独立上市复核；批准前生命周期必须保持 PENDING
  rpc ReviewContractSeriesLaunch(ReviewContractSeriesLaunchReq) returns (GetContractSeriesResp);

  // 将失败或人工处理的成交持仓事件重新置为待执行
  rpc RetryTradeEvent(RetryTradeEventReq) returns (CommonResp);

  // 分页查询卖方风险账户
  rpc ListRiskAccounts(ListRiskAccountsReq) returns (ListRiskAccountsResp);

  // 创建不可覆盖的组合保证金参数草案
  rpc CreatePortfolioRiskConfig(CreatePortfolioRiskConfigReq) returns (GetPortfolioRiskConfigResp);

  // 由独立管理员批准或拒绝组合保证金参数版本
  rpc ReviewPortfolioRiskConfig(ReviewPortfolioRiskConfigReq) returns (GetPortfolioRiskConfigResp);

  // 分页查询组合保证金参数版本
  rpc ListPortfolioRiskConfigs(ListPortfolioRiskConfigsReq) returns (ListPortfolioRiskConfigsResp);

  // 分页查询强平记录
  rpc ListLiquidations(ListLiquidationsReq) returns (ListLiquidationsResp);

  // 将失败或人工处理的强平记录重新置为待执行
  rpc RetryLiquidation(RetryLiquidationReq) returns (CommonResp);

  // 创建保险接管库存主动退出的不可变待复核申请
  rpc CreateInsuranceInventoryExit(CreateInsuranceInventoryExitReq) returns (GetInsuranceInventoryExitResp);

  // 由独立管理员批准或拒绝保险库存退出申请
  rpc ReviewInsuranceInventoryExit(ReviewInsuranceInventoryExitReq) returns (GetInsuranceInventoryExitResp);

  // 重新校验库存和行情后，幂等提交管理来源的IOC减仓单
  rpc ExecuteInsuranceInventoryExit(ExecuteInsuranceInventoryExitReq) returns (GetInsuranceInventoryExitResp);

  // 分页查询保险库存退出申请
  rpc ListInsuranceInventoryExits(ListInsuranceInventoryExitsReq) returns (ListInsuranceInventoryExitsResp);

  // 按行权单重试失败或人工处理的资产指令
  rpc RetryExercise(RetryExerciseReq) returns (CommonResp);

  // 校验归属后重试结算批次中的失败资产指令
  rpc RetrySettlementInstruction(RetrySettlementInstructionReq) returns (CommonResp);

  // 人工复核后解除用户 kill switch
  rpc ReleaseUserKillSwitch(ReleaseUserKillSwitchReq) returns (CommonResp);

  // 查询用户 kill switch
  rpc AdminGetUserTradingControl(AdminGetUserTradingControlReq) returns (AdminGetUserTradingControlResp);

  // 分页查询交易控制审计事件
  rpc ListTradingControlEvents(ListTradingControlEventsReq) returns (ListTradingControlEventsResp);

  // 创建异常成交现金更正草案，同时暂停合约并撤销活动订单
  rpc CreateTradeCorrection(CreateTradeCorrectionReq) returns (GetTradeCorrectionResp);

  // 由独立管理员批准或拒绝异常成交更正
  rpc ReviewTradeCorrection(ReviewTradeCorrectionReq) returns (GetTradeCorrectionResp);

  // 分页查询异常成交更正案件
  rpc ListTradeCorrections(ListTradeCorrectionsReq) returns (ListTradeCorrectionsResp);

  // 创建或更新做市商保护参数；任何变更都会撤销该组已有 MMP 报价
  rpc UpsertMMPConfig(UpsertMMPConfigReq) returns (GetMMPConfigResp);

  // 人工复核并恢复触发中的 MMP 报价组
  rpc ResetMMPConfig(ResetMMPConfigReq) returns (GetMMPConfigResp);

  // 分页查询 MMP 配置和实时窗口状态
  rpc ListMMPConfigs(ListMMPConfigsReq) returns (ListMMPConfigsResp);

  // 分页查询实物交割配对单元和失败状态
  rpc ListPhysicalDeliveryUnits(ListPhysicalDeliveryUnitsReq) returns (ListPhysicalDeliveryUnitsResp);

  // 人工确认补资后，按原指令号重试一个实物交割单元
  rpc RetryPhysicalDeliveryUnit(RetryPhysicalDeliveryUnitReq) returns (CommonResp);
}

message CommonResp {
  common.RespBase base = 1;
}

message ListSettlementPricesReq {
  int64 tenant_id = 1;
  int64 contract_id = 2;
  SettlementPriceStatus status = 3;
  common.PageReq page = 4;
}

message ListSettlementPricesResp {
  common.RespBase base = 1;
  repeated OptionSettlementPrice data = 2;
  int64 total = 3;
}

message GetSettlementPriceResp {
  common.RespBase base = 1;
  OptionSettlementPrice data = 2;
}

message CreateSettlementPriceCorrectionReq {
  int64 tenant_id = 1;
  int64 contract_id = 2;
  string delivery_price = 3;
  string source_snapshot_ids = 4;
  string reason = 5;
}

message ReviewSettlementPriceReq {
  int64 tenant_id = 1;
  int64 settlement_price_id = 2;
  bool approve = 3;
  string reason = 4;
}

message ForceCancelContractOrdersReq {
  int64 tenant_id = 1;
  int64 contract_id = 2;
  string reason = 3;
}

message RetryAssetInstructionReq {
  int64 tenant_id = 1;
  int64 instruction_id = 2;
  string reason = 3;
}

message RetrySettlementInstructionReq {
  int64 tenant_id = 1;
  int64 settlement_id = 2;
  int64 instruction_id = 3;
  string reason = 4;
}

message ReleaseUserKillSwitchReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  string reason = 3;
}

message AdminGetUserTradingControlReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
}

message AdminGetUserTradingControlResp {
  common.RespBase base = 1;
  OptionUserTradingControl data = 2;
}

message ListTradingControlEventsReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  int64 contract_id = 3;
  string event_type = 4;
  string reason = 5;
  common.PageReq page = 6;
}

message ListTradingControlEventsResp {
  common.RespBase base = 1;
  repeated OptionTradingControlEvent data = 2;
}

message TradeCorrectionLegInput {
  int64 user_id = 1;
  int64 account_id = 2;
  string coin = 3;
  TradeCorrectionLegDirection direction = 4;
  string amount = 5;
}

message CreateTradeCorrectionReq {
  int64 tenant_id = 1;
  int64 trade_id = 2;
  TradeCorrectionAction action = 3;
  string reason = 4;
  string evidence_ref = 5;
  repeated TradeCorrectionLegInput legs = 6;
}

message ReviewTradeCorrectionReq {
  int64 tenant_id = 1;
  int64 correction_id = 2;
  bool approve = 3;
  string reason = 4;
}

message GetTradeCorrectionResp {
  common.RespBase base = 1;
  OptionTradeCorrection data = 2;
}

message ListTradeCorrectionsReq {
  int64 tenant_id = 1;
  int64 trade_id = 2;
  int64 contract_id = 3;
  TradeCorrectionStatus status = 4;
  common.PageReq page = 5;
}

message ListTradeCorrectionsResp {
  common.RespBase base = 1;
  repeated OptionTradeCorrection data = 2;
  int64 total = 3;
}

message UpsertMMPConfigReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  int64 contract_id = 3;
  string group_code = 4;
  common.YesNo enabled = 5;
  string qty_threshold = 6;
  int64 trade_count_threshold = 7;
  string loss_threshold = 8;
  int64 window_seconds = 9;
  int64 cooldown_seconds = 10;
