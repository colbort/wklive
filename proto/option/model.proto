syntax = "proto3";

package option;

import "proto/common/common.proto";
import "proto/option/enum.proto";

option go_package = "wklive/proto/option;option";

message OptionContract {
  int64 id = 1;
  int64 tenant_id = 2;
  string contract_code = 3;
  string underlying_symbol = 4;
  string settle_coin = 5;
  string quote_coin = 6;
  OptionType option_type = 7;
  ExerciseStyle exercise_style = 8;
  SettlementType settlement_type = 9;
  string strike_price = 10;
  string contract_unit = 11;
  string min_order_qty = 12;
  string max_order_qty = 13;
  string price_tick = 14;
  string qty_step = 15;
  string multiplier = 16;
  int64 list_time = 17;
  int64 expire_time = 18;
  int64 deliver_time = 19;
  common.YesNo is_auto_exercise = 20; // 是否自动行权
  ContractStatus status = 21;
  int64 sort = 22;
  string remark = 23;
  common.YesNo is_deleted = 24; // 是否删除
  int64 create_times = 25;
  int64 update_times = 26;
  string maker_fee_rate = 27;
  string taker_fee_rate = 28;
  string exercise_fee_rate = 29;
  int64 fee_user_id = 30;
  int64 fee_account_id = 31;
  SellerMarginMode seller_margin_mode = 32;
  string initial_margin_rate = 33;
  string maintenance_margin_rate = 34;
  string min_margin_rate = 35;
  string liquidation_fee_rate = 36;
  int64 insurance_user_id = 37;
  int64 insurance_account_id = 38;
  LiquidationDeficitPolicy liquidation_deficit_policy = 39;
  string underlying_coin = 40;
  PhysicalDeliveryPolicy physical_delivery_policy = 41;
  string settlement_price_source = 42;
  string settlement_price_method = 43;
  int64 settlement_window_seconds = 44;
  int64 settlement_min_samples = 45;
  int64 exercise_cutoff_time = 46;
  string auto_exercise_threshold = 47;
  string max_user_long_qty = 48;
  string max_user_short_qty = 49;
  string max_open_interest = 50;
  string order_price_band_ratio = 51;
  string circuit_breaker_ratio = 52;
  int64 physical_delivery_cure_seconds = 53;
  string trading_calendar_code = 54;
  int64 greeks_max_age_seconds = 55;
}

message OptionTradingCalendarSession {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 calendar_id = 3;
  int32 weekday = 4; // 0=Sunday
  int32 open_second = 5;
  int32 close_second = 6; // 可大于86400表示跨午夜，最大172800
  int64 create_times = 7;
}

message OptionTradingCalendarException {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 calendar_id = 3;
  TradingCalendarExceptionType exception_type = 4;
  int64 start_time = 5;
  int64 end_time = 6;
  string reason = 7;
  string announcement_ref = 8;
  int64 create_times = 9;
}

message OptionTradingCalendar {
  int64 id = 1;
  int64 tenant_id = 2;
  string calendar_code = 3;
  int64 version = 4;
  TradingCalendarStatus status = 5;
  string timezone = 6;
  int64 effective_from = 7;
  int64 effective_until = 8;
  int64 supersedes_id = 9;
  string change_reason = 10;
  string evidence_ref = 11;
  int64 created_by = 12;
  int64 reviewed_by = 13;
  string review_reason = 14;
  int64 reviewed_at = 15;
  int64 create_times = 16;
  int64 update_times = 17;
  repeated OptionTradingCalendarSession sessions = 18;
  repeated OptionTradingCalendarException exceptions = 19;
}

message OptionTradingHalt {
  int64 id = 1;
  int64 tenant_id = 2;
  string halt_no = 3;
  int64 contract_id = 4;
  TradingHaltSource source = 5;
  TradingHaltStatus status = 6;
  string reason = 7;
  string evidence_ref = 8;
  int64 started_at = 9;
  int64 created_by = 10;
  int64 cancel_total = 11;
  int64 cancel_success = 12;
  int64 cancel_failed = 13;
  string last_error_msg = 14;
  int64 lifted_at = 15;
  int64 lifted_by = 16;
  string lift_reason = 17;
  int64 create_times = 18;
  int64 update_times = 19;
}

message OptionCorporateActionContract {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 action_id = 3;
  int64 source_contract_id = 4;
  int64 successor_contract_id = 5;
  CorporateActionExecutionMode execution_mode = 6;
  string quantity_numerator = 7;
  string quantity_denominator = 8;
  int64 halt_id = 9;
  CorporateActionContractStatus status = 10;
  int64 position_total = 11;
  int64 position_completed = 12;
  int64 position_failed = 13;
  int64 last_position_id = 14;
  int64 retry_count = 15;
  string last_error_msg = 16;
  int64 create_times = 17;
  int64 update_times = 18;
}

message OptionCorporateAction {
  int64 id = 1;
  int64 tenant_id = 2;
  string event_no = 3;
  string external_event_ref = 4;
  int64 version = 5;
  string underlying_symbol = 6;
