  CorporateActionStatus status = 8;
  int64 announcement_time = 9;
  int64 ex_time = 10;
  int64 record_time = 11;
  int64 effective_time = 12;
  int64 pay_time = 13;
  string evidence_ref = 14;
  string evidence_hash = 15;
  string description = 16;
  int64 created_by = 17;
  int64 reviewed_by = 18;
  string review_reason = 19;
  int64 reviewed_at = 20;
  int64 completed_at = 21;
  string last_error_msg = 22;
  int64 create_times = 23;
  int64 update_times = 24;
  repeated OptionCorporateActionContract contracts = 25;
}

message OptionCorporateActionPosition {
  int64 id = 1;
