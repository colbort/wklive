syntax = "proto3";

package option;

import "proto/common/common.proto";
import "proto/option/enum.proto";

option go_package = "wklive/proto/option;option";

message OptionContract {
  int64 id = 1;
  int64 tenant_id = 2;
  string contract_code = 3;
  string underlying_symbol = 4;
  string settle_coin = 5;
  string quote_coin = 6;
  OptionType option_type = 7;
  ExerciseStyle exercise_style = 8;
  SettlementType settlement_type = 9;
  string strike_price = 10;
  string contract_unit = 11;
  string min_order_qty = 12;
  string max_order_qty = 13;
  string price_tick = 14;
  string qty_step = 15;
  string multiplier = 16;
  int64 list_time = 17;
  int64 expire_time = 18;
  int64 deliver_time = 19;
  common.YesNo is_auto_exercise = 20; // 是否自动行权
  ContractStatus status = 21;
  int64 sort = 22;
  string remark = 23;
  common.YesNo is_deleted = 24; // 是否删除
  int64 create_times = 25;
  int64 update_times = 26;
  string maker_fee_rate = 27;
  string taker_fee_rate = 28;
  string exercise_fee_rate = 29;
  int64 fee_user_id = 30;
  int64 fee_account_id = 31;
  SellerMarginMode seller_margin_mode = 32;
  string initial_margin_rate = 33;
  string maintenance_margin_rate = 34;
  string min_margin_rate = 35;
  string liquidation_fee_rate = 36;
  int64 insurance_user_id = 37;
  int64 insurance_account_id = 38;
  LiquidationDeficitPolicy liquidation_deficit_policy = 39;
  string underlying_coin = 40;
  PhysicalDeliveryPolicy physical_delivery_policy = 41;
}

message OptionMarket {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 contract_id = 3;
  string underlying_price = 4;
  string mark_price = 5;
  string last_price = 6;
  string bid_price = 7;
  string ask_price = 8;
  string theoretical_price = 9;
  string intrinsic_value = 10;
  string time_value = 11;
  string iv = 12;
  string delta = 13;
  string gamma = 14;
  string theta = 15;
  string vega = 16;
  string rho = 17;
  string risk_free_rate = 18;
  string pricing_model = 19;
  int64 snapshot_time = 20;
  int64 create_times = 21;
  int64 update_times = 22;
}

message OptionMarketSnapshot {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 contract_id = 3;
  string underlying_price = 4;
  string mark_price = 5;
  string last_price = 6;
  string bid_price = 7;
  string ask_price = 8;
  string theoretical_price = 9;
  string iv = 10;
  string delta = 11;
  string gamma = 12;
  string theta = 13;
  string vega = 14;
  string rho = 15;
  int64 snapshot_time = 16;
  int64 create_times = 17;
}

message OptionOrder {
  int64 id = 1;
  int64 tenant_id = 2;
  string order_no = 3;
  int64 user_id = 4;
  int64 account_id = 5;
  int64 contract_id = 6;
  string underlying_symbol = 7;
  common.Side side = 8; // 买卖方向
  PositionEffect position_effect = 9;
  OrderType order_type = 10;
  string price = 11;
  string qty = 12;
  string filled_qty = 13;
  string unfilled_qty = 14;
  string avg_price = 15;
  string turnover = 16;
  string fee = 17;
  string fee_coin = 18;
  string margin_amount = 19;
  OrderSource source = 20;
  string client_order_id = 21;
  common.YesNo reduce_only = 22; // 是否只减仓
  common.YesNo mmp = 23; // 是否做市商保护单
  OrderStatus status = 24;
  string cancel_reason = 25;
  int64 match_time = 26;
  int64 cancel_time = 27;
  int64 create_times = 28;
  int64 update_times = 29;
  string margin_coin = 30;
}

message OptionTrade {
  int64 id = 1;
  int64 tenant_id = 2;
  string trade_no = 3;
  int64 contract_id = 4;
  string underlying_symbol = 5;
  int64 buy_order_id = 6;
  string buy_order_no = 7;
  int64 buy_user_id = 8;
  int64 buy_account_id = 9;
  int64 sell_order_id = 10;
  string sell_order_no = 11;
  int64 sell_user_id = 12;
  int64 sell_account_id = 13;
  string price = 14;
  string qty = 15;
  string turnover = 16;
  string buy_fee = 17;
  string sell_fee = 18;
  string fee_coin = 19;
  common.Side maker_side = 20; // maker方向
  int64 trade_time = 21;
  int64 create_times = 22;
  int64 match_sequence = 23;
}

message OptionPosition {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 user_id = 3;
  int64 account_id = 4;
  int64 contract_id = 5;
  string underlying_symbol = 6;
  common.PositionSide side = 7; // 持仓方向
  string position_qty = 8;
  string available_qty = 9;
  string frozen_qty = 10;
  string open_avg_price = 11;
  string mark_price = 12;
  string position_value = 13;
  string margin_amount = 14;
  string maintenance_margin = 15;
  string unrealized_pnl = 16;
  string realized_pnl = 17;
  string exerciseable_qty = 18;
  PositionStatus status = 19;
  int64 last_calc_time = 20;
  int64 create_times = 21;
  int64 update_times = 22;
}

message OptionExercise {
  int64 id = 1;
  int64 tenant_id = 2;
  string exercise_no = 3;
  int64 user_id = 4;
  int64 account_id = 5;
  int64 contract_id = 6;
  int64 position_id = 7;
  ExerciseType exercise_type = 8;
  string exercise_qty = 9;
  string strike_price = 10;
  string settlement_price = 11;
  string exercise_amount = 12;
  string profit_amount = 13;
  string fee = 14;
  string fee_coin = 15;
  ExerciseStatus status = 16;
  string remark = 17;
  int64 exercise_time = 18;
  int64 finish_time = 19;
  int64 create_times = 20;
  int64 update_times = 21;
}

message OptionExerciseAssignment {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 exercise_id = 3;
  string exercise_no = 4;
  int64 long_position_id = 5;
  int64 short_position_id = 6;
  int64 short_user_id = 7;
  int64 short_account_id = 8;
  string quantity = 9;
  string payoff = 10;
  ExerciseAssignmentStatus status = 11;
  string instruction_no = 12;
  int64 create_times = 13;
  int64 update_times = 14;
}

message OptionSettlement {
  int64 id = 1;
  int64 tenant_id = 2;
  string settlement_no = 3;
  int64 contract_id = 4;
  string underlying_symbol = 5;
  int64 expire_time = 6;
  int64 settlement_time = 7;
  string delivery_price = 8;
  string theoretical_price = 9;
  string iv = 10;
  common.YesNo is_itm = 11; // 是否实值
  ExerciseResult exercise_result = 12;
  SettlementStatus status = 13;
  string remark = 14;
  int64 create_times = 15;
  int64 update_times = 16;
}

message OptionSettlementPrice {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 contract_id = 3;
  string price_source = 4;
  int64 window_start = 5;
  int64 window_end = 6;
  int64 sample_count = 7;
  string calculation_method = 8;
  string delivery_price = 9;
  string source_snapshot_ids = 10;
  int64 version = 11;
  SettlementPriceStatus status = 12;
  int64 confirmed_by = 13;
  int64 confirmed_at = 14;
  int64 create_times = 15;
  int64 update_times = 16;
}

message OptionSettlementBatch {
  int64 id = 1;
  int64 tenant_id = 2;
  string batch_no = 3;
  int64 contract_id = 4;
  int64 settlement_price_id = 5;
  string total_credit = 6;
  string total_debit = 7;
  int64 instruction_count = 8;
  int64 success_count = 9;
  SettlementBatchStatus status = 10;
  string last_error_msg = 11;
  int64 create_times = 12;
  int64 update_times = 13;
}

message OptionSettlementPositionDetail {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 batch_id = 3;
  string batch_no = 4;
  int64 contract_id = 5;
  int64 position_id = 6;
  int64 user_id = 7;
  int64 account_id = 8;
  common.PositionSide side = 9;
  string quantity = 10;
  string payoff = 11;
  SettlementDetailDirection direction = 12;
  string instruction_no = 13;
  int64 create_times = 14;
  string delivery_coin = 15;
  string delivery_quantity = 16;
  string payment_coin = 17;
  string payment_amount = 18;
}

message OptionReconciliationIssue {
  int64 id = 1;
  int64 tenant_id = 2;
  string issue_key = 3;
  ReconciliationCheckType check_type = 4;
  string biz_no = 5;
  int64 instruction_id = 6;
  string expected_value = 7;
  string actual_value = 8;
  string detail = 9;
  ReconciliationIssueStatus status = 10;
  int64 occurrence_count = 11;
  int64 resolved_at = 12;
  int64 create_times = 13;
  int64 update_times = 14;
}

message OptionAccount {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 user_id = 3;
  int64 account_id = 4;
  string margin_coin = 5;
  string balance = 6;
  string available_balance = 7;
  string frozen_balance = 8;
  string position_margin = 9;
  string order_margin = 10;
  string unrealized_pnl = 11;
  string realized_pnl = 12;
  string risk_rate = 13;
  AccountStatus status = 14;
  int64 create_times = 15;
  int64 update_times = 16;
}

message OptionBill {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 user_id = 3;
  int64 account_id = 4;
  string biz_no = 5;
  BillRefType ref_type = 6;
  int64 ref_id = 7;
  string coin = 8;
  string change_amount = 9;
  string balance_before = 10;
  string balance_after = 11;
  string remark = 12;
  int64 create_times = 13;
}

message OptionAssetInstruction {
  int64 id = 1;
  int64 tenant_id = 2;
  string instruction_no = 3;
  string biz_no = 4;
  int64 order_id = 5;
  int64 trade_id = 6;
  int64 position_id = 7;
  int64 user_id = 8;
  int64 account_id = 9;
  AssetInstructionAction action = 10;
  string target_biz_no = 11;
  string coin = 12;
  string amount = 13;
  int64 step_no = 14;
  AssetInstructionStatus status = 15;
  int64 retry_count = 16;
  int64 next_retry_at = 17;
  string last_error_msg = 18;
  int64 create_times = 19;
  int64 update_times = 20;
  string asset_flow_no = 21;
  AssetReconciliationStatus reconciliation_status = 22;
  int64 reconciled_at = 23;
  int64 margin_lot_id = 24;
  int64 liquidation_id = 25;
}

message OptionOutboxEvent {
  int64 id = 1;
  int64 tenant_id = 2;
  string event_no = 3;
  OptionEventType event_type = 4;
  int64 contract_id = 5;
  int64 trade_id = 6;
  int64 match_sequence = 7;
  OptionEventStatus status = 8;
  int64 retry_count = 9;
  int64 next_retry_at = 10;
  string last_error_msg = 11;
  int64 create_times = 12;
  int64 update_times = 13;
}

message OptionInboxEvent {
  int64 id = 1;
  int64 tenant_id = 2;
  string event_no = 3;
  OptionEventType event_type = 4;
  int64 contract_id = 5;
  int64 trade_id = 6;
  int64 match_sequence = 7;
  OptionInboxStatus status = 8;
  string last_error_msg = 9;
  int64 create_times = 10;
  int64 update_times = 11;
}

message OptionMarginLot {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 user_id = 3;
  int64 account_id = 4;
  int64 contract_id = 5;
  int64 position_id = 6;
  int64 order_id = 7;
  int64 trade_id = 8;
  string freeze_biz_no = 9;
  string quantity = 10;
  string initial_margin = 11;
  string remaining_margin = 12;
  MarginLotStatus status = 13;
  int64 create_times = 14;
  int64 update_times = 15;
  string remaining_quantity = 16;
  string pending_margin = 17;
}

message OptionRiskAccount {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 user_id = 3;
  int64 account_id = 4;
  string settle_coin = 5;
  string equity = 6;
  string position_margin = 7;
  string maintenance_margin = 8;
  string unrealized_pnl = 9;
  string risk_rate = 10;
  RiskAccountStatus status = 11;
  int64 last_calc_time = 12;
  int64 create_times = 13;
  int64 update_times = 14;
  PortfolioRiskMethod portfolio_risk_method = 15;
  string portfolio_scenario_loss = 16;
  string portfolio_short_floor = 17;
}

message OptionLiquidation {
  int64 id = 1;
  int64 tenant_id = 2;
  string liquidation_no = 3;
  int64 user_id = 4;
  int64 account_id = 5;
  int64 contract_id = 6;
  int64 position_id = 7;
  string quantity = 8;
  string mark_price = 9;
  string maintenance_margin = 10;
  string equity = 11;
  string deficit_amount = 12;
  string liquidation_fee = 13;
  LiquidationStatus status = 14;
  int64 retry_count = 15;
  string last_error_msg = 16;
  int64 create_times = 17;
  int64 update_times = 18;
  string collateral_amount = 19;
  string insurance_fund_amount = 20;
  string remaining_deficit = 21;
  int64 takeover_position_id = 22;
  int64 completed_at = 23;
  int64 insurance_attempt = 24;
  string backstop_amount = 25;
  LiquidationDeficitResolution deficit_resolution = 26;
}

message OptionInsuranceFundFlow {
  int64 id = 1;
  int64 tenant_id = 2;
  string flow_no = 3;
  int64 contract_id = 4;
  int64 liquidation_id = 5;
  InsuranceFundFlowType flow_type = 6;
  string coin = 7;
  string amount = 8;
  string asset_flow_no = 9;
  int64 create_times = 10;
}

message OptionContractDetail {
  OptionContract contract = 1;
  OptionMarket market = 2;
}

message OptionPositionDetail {
  OptionPosition position = 1;
  OptionContract contract = 2;
  OptionMarket market = 3;
}

message OptionOrderDetail {
  OptionOrder order = 1;
  OptionContract contract = 2;
}

message OptionTradeDetail {
  OptionTrade trade = 1;
  OptionContract contract = 2;
}

message OptionExerciseDetail {
  OptionExercise exercise = 1;
  OptionContract contract = 2;
  repeated OptionExerciseAssignment assignments = 3;
  repeated OptionAssetInstruction asset_instructions = 4;
}

message OptionSettlementDetail {
  OptionSettlement settlement = 1;
  OptionContract contract = 2;
  OptionSettlementBatch batch = 3;
  repeated OptionSettlementPositionDetail position_details = 4;
  repeated OptionAssetInstruction asset_instructions = 5;
}
