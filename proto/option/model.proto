// 公开市场统计均来自 Option 自身成交和已落仓持仓；OI 为单边未平仓量。
message OptionMarketStatistics {
  int64 contract_id = 1;
  string volume_24h = 2;
  string turnover_24h = 3;
  int64 trade_count_24h = 4;
  string open_interest = 5;
  string long_open_interest = 6;
  string short_open_interest = 7;
  bool oi_balanced = 8;
  int64 statistics_window_start = 9;
  int64 statistics_as_of = 10;
  int64 position_as_of = 11;
  string source = 12;
  string open_interest_method = 13;
}

message OptionChainLeg {
  OptionContract contract = 1;
  OptionMarket market = 2;
  OptionMarketStatistics statistics = 3;
}

message OptionChainRow {
  string strike_price = 1;
  OptionChainLeg call = 2;
  OptionChainLeg put = 3;
}

message OptionOrderBookLevel {
  string price = 1;
