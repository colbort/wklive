}

message OptionContractSeries {
  int64 id = 1;
  int64 tenant_id = 2;
  string request_key = 3;
  string series_code = 4;
  int64 version = 5;
  int64 supersedes_id = 6;
  ContractSeriesStatus status = 7;
  int64 template_contract_id = 8;
  string underlying_symbol = 9;
  string reference_price = 10;
  string reference_source = 11;
  int64 reference_time = 12;
  string evidence_ref = 13;
  string change_reason = 14;
  string payload_hash = 15;
  int64 expected_contract_count = 16;
  int64 generated_contract_count = 17;
  int64 created_by = 18;
  int64 reviewed_by = 19;
  string review_reason = 20;
  int64 reviewed_at = 21;
  int64 generated_at = 22;
  int64 create_times = 23;
  int64 update_times = 24;
