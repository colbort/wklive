  int64 update_times = 15;
}

message OptionComboOrderDetail {
  OptionComboOrder combo_order = 1;
  repeated OptionComboOrderLeg legs = 2;
}

// 管理端组合单下钻数据。用户端详情不得复用该类型，避免暴露对手方和资金处理信息。
message OptionAdminComboOrderDetail {
  OptionComboOrder combo_order = 1;
  repeated OptionComboOrderLeg legs = 2;
  repeated OptionOrderDetail child_orders = 3;
  repeated OptionTradeDetail trades = 4;
  repeated OptionAssetInstruction asset_instructions = 5;
  int64 trade_total = 6;
  int64 asset_instruction_total = 7;
