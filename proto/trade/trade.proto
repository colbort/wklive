// 交易服务内部接口
service Trade {
  // 内部服务查询可配置的交易对，不依赖管理后台登录上下文。
  rpc GetSymbolList(GetSymbolListAdminReq) returns (GetSymbolListAdminResp);

  // 内部服务获取指定交易对配置，不依赖用户端登录上下文。
  rpc GetSymbolDetail(GetSymbolDetailReq) returns (GetSymbolDetailResp);

  // 平台内部做市账户报价，不依赖用户登录 metadata。
  rpc PlaceLiquidityQuote(PlaceLiquidityQuoteReq) returns (PlaceOrderResp);
  rpc CancelLiquidityQuote(CancelLiquidityQuoteReq) returns (UserCommonResp);
  rpc GetLiquidityQuote(GetLiquidityQuoteReq) returns (GetOrderDetailResp);

  // 记录持仓历史信息
  rpc RecordPositionHistory(RecordPositionHistoryReq) returns (InternalCommonResp);

  // 创建交易事件
  rpc CreateTradeEvent(CreateTradeEventReq) returns (InternalCommonResp);

  // 校验订单风控
  rpc CheckOrderRisk(CheckOrderRiskReq) returns (CheckOrderRiskResp);
}

message PlaceLiquidityQuoteReq {
  int64 trade_user_id = 1;
  PlaceOrderReq order = 2;
}

message CancelLiquidityQuoteReq {
  int64 trade_user_id = 1;
  CancelOrderReq order = 2;
}

message GetLiquidityQuoteReq {
  int64 trade_user_id = 1;
  GetOrderDetailReq order = 2;
}

message InternalCommonResp {
  common.RespBase base = 1;
}

message RecordOrderFillReq {
  TradeFill fill = 1;
}

message RecordPositionHistoryReq {
  ContractPositionHistory history = 1;
}

message CreateTradeEventReq {
  BizTradeEvent event = 1;
}

message CheckOrderRiskReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  int64 symbol_id = 3;
  reserved 4;
  common.Side side = 5; // 买卖方向
  PositionSide position_side = 6;
  OrderType order_type = 7;
  string price = 8;
  string qty = 9;
  string amount = 10;
  common.YesNo is_reduce_only = 11;
  OrderSourceType order_source = 12;
  TriggerKind trigger_kind = 13;
  // 由下单域根据具体产品和持仓方向计算，避免把 BUY 错当成所有产品的开仓。
  common.YesNo exposure_increasing = 14;
  string reference_price = 15;
}

message CheckOrderRiskResp {
  int64 passed = 1;
  string reject_code = 2;
  string reject_msg = 3;
}

message TradeTaskReq {
  int64 tenant_id = 1;
}

message TradeTaskResp {
  common.RespBase base = 1;
}

// ====================
// 定时任务
// ====================
service Task {
  // 订单撮合
  rpc ProcessOrderMatching(TradeTaskReq) returns (TradeTaskResp);
  // 仓位处理（标记价格刷新/强平扫描/普通平仓）
  rpc ProcessPositions(TradeTaskReq) returns (TradeTaskResp);
  // 合约结算（资金费率/交割合约）
  rpc ProcessContractSettlements(TradeTaskReq) returns (TradeTaskResp);
  // 秒合约激活与到期结算
  rpc ProcessSecondsSettlements(TradeTaskReq) returns (TradeTaskResp);
  // 交易事件处理（失败重试/冻结资产修复）
  rpc ProcessTradeEvents(TradeTaskReq) returns (TradeTaskResp);
  // 风控限制过期恢复
  rpc ExpireRiskLimits(TradeTaskReq) returns (TradeTaskResp);
  // 归档零成交且已撤销的做市订单
  rpc ArchiveLiquidityOrders(TradeTaskReq) returns (TradeTaskResp);
}
