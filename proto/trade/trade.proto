}

message GetUserSymbolLimitReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
  int64 symbol_id = 3;
  reserved 4;
}

message GetUserSymbolLimitResp {
  common.RespBase base = 1;
  RiskUserSymbolLimit data = 2;
}

message ListUserTradeControlsReq {
  int64 tenant_id = 1;
  common.PageReq page = 2;
  int64 user_id = 3;
  common.ProductType product_type = 4;
  common.ContractType contract_type = 5;
  int64 symbol_id = 6;
  common.Enable enabled = 7;
  int64 scope_type = 8; // 0全部 1产品级 2交易对级
}

message ListUserTradeControlsResp {
  common.RespBase base = 1;
  repeated UserTradeControlEntry data = 2;
}

message DisableUserTradeControlReq {
  int64 tenant_id = 1;
  int64 control_id = 2;
  int64 scope_type = 3;
  int64 expected_version = 4;
  string reason = 5;
}

message ListUserTradeControlAuditsReq {
  int64 tenant_id = 1;
  common.PageReq page = 2;
