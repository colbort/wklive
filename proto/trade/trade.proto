message GetSymbolLeverageConfigListReq {
  int64 tenant_id = 1;
  common.PageReq page = 2;
  int64 symbol_id = 3;
  reserved 4;
  MarginMode margin_mode = 5;
  common.Enable enabled = 6; // 状态,0表示全部，1表示启用，2表示禁用
}

message GetSymbolLeverageConfigListResp {
  common.RespBase base = 1;
  repeated TradeSymbolLeverageConfig data = 2;
}

message GetOrderListAdminReq {
