syntax = "proto3";

package trade;

import "proto/common/common.proto";
import "proto/trade/enum.proto";
import "proto/trade/model.proto";

option go_package = "wklive/proto/trade;trade";

// APP 交易服务接口
service App {
  // 获取交易对列表
  rpc GetSymbolList(GetSymbolListReq) returns (GetSymbolListResp);

  // 获取指定交易对详情
  rpc GetSymbolDetail(GetSymbolDetailReq) returns (GetSymbolDetailResp);

  // 下单
  rpc PlaceOrder(PlaceOrderReq) returns (PlaceOrderResp);

  // 撤销指定订单
  rpc CancelOrder(CancelOrderReq) returns (UserCommonResp);

  // 撤销当前用户全部订单
  rpc CancelAllOrders(CancelAllOrdersReq) returns (CancelAllOrdersResp);

  // 获取订单列表
  rpc GetOrderList(GetOrderListReq) returns (GetOrderListResp);

  // 获取订单详情
  rpc GetOrderDetail(GetOrderDetailReq) returns (GetOrderDetailResp);

  // 获取成交记录列表
  rpc GetFillList(GetFillListReq) returns (GetFillListResp);

  // 获取持仓列表
  rpc GetPositionList(GetPositionListReq) returns (GetPositionListResp);

  // 获取合约风控保证金快照列表
  rpc GetMarginSnapshotList(GetMarginSnapshotListReq) returns (GetMarginSnapshotListResp);

  // 获取当前杠杆配置
  rpc GetLeverageConfig(GetLeverageConfigReq) returns (GetLeverageConfigResp);

  // 设置杠杆倍数
  rpc SetLeverage(SetLeverageReq) returns (UserCommonResp);
}

message UserCommonResp {
  common.RespBase base = 1;
}

message GetSymbolListReq {
  common.ProductType product_type = 1;
  SymbolStatus status = 2;
  int64 category_type = 3;
  string market = 4;
}

message GetSymbolListResp {
  common.RespBase base = 1;
  repeated TradeSymbol data = 2;
}

message GetSymbolDetailReq {
  int64 symbol_id = 1;
  // 内部服务调用时显式传租户；App 接口仍从可信元数据读取租户。
  int64 tenant_id = 2;
}

message GetSymbolDetailResp {
  common.RespBase base = 1;
  GetSymbolDetailData data = 2;
}

message GetSymbolDetailData {
  TradeSymbol symbol = 1;
  TradeSymbolSpot spot = 2;
  TradeSymbolContract contract = 3;
  repeated TradeSymbolLeverageConfig leverage_configs = 4;
  repeated TradeSymbolSeconds seconds_configs = 5;
  repeated TradeSymbolSession sessions = 6;
}

message PlaceOrderReq {
  int64 symbol_id = 1;
  reserved 2;
  common.Side side = 3; // 买卖方向
  PositionSide position_side = 4;
  OrderType order_type = 5;
  TimeInForce time_in_force = 6;
  string client_order_id = 7;
  string price = 8;
  string qty = 9;
  string amount = 10;
  common.YesNo is_reduce_only = 11;
  string trigger_price = 13;
  TriggerType trigger_type = 14;
  MarginMode margin_mode = 15;
  int64 leverage = 16;
  string take_profit_price = 17;
  string stop_loss_price = 18;
  OrderSourceType order_source = 19;
  TriggerKind trigger_kind = 20;
  SecondsDirection seconds_direction = 21;
  int64 duration_seconds = 22; // 秒合约到期周期，其他产品为0
  reserved 12;
}

message PlaceOrderResp {
  common.RespBase base = 1;
  TradeOrder data = 2;
}

message CancelOrderReq {
  int64 order_id = 1;
  string order_no = 2;
  string client_order_id = 3;
}

message CancelAllOrdersReq {
  common.ProductType product_type = 1;
  int64 symbol_id = 2;
  common.Side side = 3; // 买卖方向
  PositionSide position_side = 4;
}

message CancelAllOrdersResp {
  common.RespBase base = 1;
  int64 data = 2;
}

message GetOrderListReq {
  common.PageReq page = 1;
  common.ProductType product_type = 2;
  int64 symbol_id = 3;
  OrderStatus status = 4;
  common.Side side = 5; // 买卖方向
  TimeRange time_range = 6;
}

message GetOrderListResp {
  common.RespBase base = 1;
  repeated TradeOrder data = 2;
}

message GetOrderDetailReq {
  int64 order_id = 1;
  string order_no = 2;
}

message GetOrderDetailResp {
  common.RespBase base = 1;
  GetOrderDetailData data = 2;
}

message GetOrderDetailData {
  TradeOrder order = 1;
  TradeOrderSpot spot = 2;
  TradeOrderContract contract = 3;
  TradeOrderSeconds seconds = 4;
}

message GetFillListReq {
  common.PageReq page = 1;
  common.ProductType product_type = 2;
  int64 symbol_id = 3;
  TimeRange time_range = 4;
}

message GetFillListResp {
  common.RespBase base = 1;
  repeated TradeFill data = 2;
}

message GetPositionListReq {
  common.ContractType contract_type = 1;
  int64 symbol_id = 2;
}

message GetPositionListResp {
  common.RespBase base = 1;
  repeated ContractPosition data = 2;
}

message GetMarginSnapshotListReq {
  reserved 1;
  string margin_asset = 2;
}

message GetMarginSnapshotListResp {
  common.RespBase base = 1;
  repeated ContractMarginSnapshot data = 2;
}

message GetLeverageConfigReq {
  int64 symbol_id = 1;
  reserved 2;
  MarginMode margin_mode = 3;
}

message GetLeverageConfigResp {
  common.RespBase base = 1;
  ContractLeverageConfig data = 2;
}

message SetLeverageReq {
  int64 symbol_id = 1;
  reserved 2;
  MarginMode margin_mode = 3;
  int64 long_leverage = 5;
  int64 short_leverage = 6;
  reserved 4;
}

// 交易服务管理后台接口
service Admin {
  // 创建交易对
  rpc CreateSymbol(CreateSymbolReq) returns (CommonResp);

  // 更新交易对信息
  rpc UpdateSymbol(UpdateSymbolReq) returns (CommonResp);

  // 获取后台交易对列表
  rpc GetSymbolListAdmin(GetSymbolListAdminReq) returns (GetSymbolListAdminResp);

  // 获取交易对详情
  rpc GetSymbolDetailAdmin(GetSymbolDetailAdminReq) returns (GetSymbolDetailAdminResp);

  // 设置现货交易对配置
  rpc SetSpotSymbolConfig(SetSpotSymbolConfigReq) returns (CommonResp);

  // 设置合约交易对配置
  rpc SetContractSymbolConfig(SetContractSymbolConfigReq) returns (CommonResp);

  // 设置秒合约产品配置
  rpc SetSecondsSymbolConfig(SetSecondsSymbolConfigReq) returns (CommonResp);

  // 保存交易时段配置
  rpc SetSymbolSession(SetSymbolSessionReq) returns (CommonResp);

  // 保存交易对杠杆档位配置
  rpc SetSymbolLeverageConfig(SetSymbolLeverageConfigReq) returns (CommonResp);

  // 获取交易对杠杆档位配置
  rpc GetSymbolLeverageConfig(GetSymbolLeverageConfigReq) returns (GetSymbolLeverageConfigResp);

  // 获取交易对杠杆档位配置列表
  rpc GetSymbolLeverageConfigList(GetSymbolLeverageConfigListReq) returns (GetSymbolLeverageConfigListResp);

  // 获取后台订单列表
  rpc GetOrderListAdmin(GetOrderListAdminReq) returns (GetOrderListAdminResp);

  // 获取订单详情
  rpc GetOrderDetailAdmin(GetOrderDetailAdminReq) returns (GetOrderDetailAdminResp);

  // 获取后台成交记录列表
  rpc GetFillListAdmin(GetFillListAdminReq) returns (GetFillListAdminResp);

  // 获取成交详情
  rpc GetFillDetailAdmin(GetFillDetailAdminReq) returns (GetFillDetailAdminResp);

  // 获取后台持仓列表
  rpc GetPositionListAdmin(GetPositionListAdminReq) returns (GetPositionListAdminResp);

  // 获取持仓详情
  rpc GetPositionDetailAdmin(GetPositionDetailAdminReq) returns (GetPositionDetailAdminResp);

  // 获取持仓历史列表
  rpc GetPositionHistoryListAdmin(GetPositionHistoryListAdminReq) returns (GetPositionHistoryListAdminResp);

  // 获取合约风控保证金快照列表
  rpc GetMarginSnapshotListAdmin(GetMarginSnapshotListAdminReq) returns (GetMarginSnapshotListAdminResp);

  // 获取撤单日志列表
  rpc GetCancelLogListAdmin(GetCancelLogListAdminReq) returns (GetCancelLogListAdminResp);

  // 设置用户交易限制
  rpc SetUserTradeLimit(SetUserTradeLimitReq) returns (CommonResp);

  // 设置用户交易对限制
  rpc SetUserSymbolLimit(SetUserSymbolLimitReq) returns (CommonResp);

  // 获取用户交易限制
  rpc GetUserTradeLimit(GetUserTradeLimitReq) returns (GetUserTradeLimitResp);

  // 获取用户交易对限制
  rpc GetUserSymbolLimit(GetUserSymbolLimitReq) returns (GetUserSymbolLimitResp);

  // 分页获取统一用户交易控制
  rpc ListUserTradeControls(ListUserTradeControlsReq) returns (ListUserTradeControlsResp);

  // 停用用户交易控制
  rpc DisableUserTradeControl(DisableUserTradeControlReq) returns (CommonResp);

  // 分页获取用户交易控制审计
  rpc ListUserTradeControlAudits(ListUserTradeControlAuditsReq) returns (ListUserTradeControlAuditsResp);

  // 设置用户交易配置
  rpc SetUserTradeConfig(SetUserTradeConfigReq) returns (CommonResp);

  // 获取用户交易配置
  rpc GetUserTradeConfig(GetUserTradeConfigReq) returns (GetUserTradeConfigResp);

  // 设置用户合约偏好配置
  rpc SetContractUserConfig(SetContractUserConfigReq) returns (CommonResp);

  // 获取用户合约偏好配置
  rpc GetContractUserConfig(GetContractUserConfigReq) returns (GetContractUserConfigResp);

  // 获取风控订单校验日志列表
  rpc GetRiskOrderCheckLogList(GetRiskOrderCheckLogListReq) returns (GetRiskOrderCheckLogListResp);

  // 设置用户杠杆配置
  rpc SetUserLeverageConfig(SetUserLeverageConfigReq) returns (CommonResp);

  // 获取用户杠杆配置
  rpc GetUserLeverageConfig(GetUserLeverageConfigReq) returns (GetUserLeverageConfigResp);

  // 获取交易事件列表
  rpc GetTradeEventList(GetTradeEventListReq) returns (GetTradeEventListResp);

  // 获取交易事件详情
  rpc GetTradeEventDetail(GetTradeEventDetailReq) returns (GetTradeEventDetailResp);

  // 重试交易事件
  rpc RetryTradeEvent(RetryTradeEventReq) returns (CommonResp);

  // 保存合约风险限额档位
  rpc SetContractRiskLimitTier(SetContractRiskLimitTierReq) returns (CommonResp);
  // 获取合约风险限额档位列表
  rpc GetContractRiskLimitTierList(GetContractRiskLimitTierListReq) returns (GetContractRiskLimitTierListResp);
  // 资金费批次与结算明细（只读）
  rpc GetFundingBatchList(GetFundingBatchListReq) returns (GetFundingBatchListResp);
  rpc GetFundingSettlementList(GetFundingSettlementListReq) returns (GetFundingSettlementListResp);
  // 交割批次与结算明细（只读）
  rpc GetDeliveryBatchList(GetDeliveryBatchListReq) returns (GetDeliveryBatchListResp);
  rpc GetDeliverySettlementList(GetDeliverySettlementListReq) returns (GetDeliverySettlementListResp);
  // 强平、秒合约价格与结算异常（只读）
  rpc GetLiquidationList(GetLiquidationListReq) returns (GetLiquidationListResp);
  rpc GetAccountLiquidationList(GetAccountLiquidationListReq) returns (GetAccountLiquidationListResp);
  rpc GetAccountLiquidationDetail(GetAccountLiquidationDetailReq) returns (GetAccountLiquidationDetailResp);
  // 仅允许重试人工状态；不得修改强平金额或直接标记完成
  rpc RetryAccountLiquidation(RetryAccountLiquidationReq) returns (CommonResp);
  rpc GetSecondsPriceSnapshotList(GetSecondsPriceSnapshotListReq) returns (GetSecondsPriceSnapshotListResp);
  rpc GetAssetReservationList(GetAssetReservationListReq) returns (GetAssetReservationListResp);
  rpc GetSettlementInstructionList(GetSettlementInstructionListReq) returns (GetSettlementInstructionListResp);
  // 仅重置失败/人工处理的结算指令；不得修改金额
  rpc RetrySettlementInstruction(RetrySettlementInstructionReq) returns (CommonResp);
  // 查询及人工忽略跨服务对账差异；恢复态只能由自动对账证据关闭
  rpc GetContractReconciliationIssueList(GetContractReconciliationIssueListReq) returns (GetContractReconciliationIssueListResp);
  rpc IgnoreContractReconciliationIssue(IgnoreContractReconciliationIssueReq) returns (CommonResp);
  rpc SetInsuranceFundAccount(SetInsuranceFundAccountReq) returns (CommonResp);
  rpc GetInsuranceFundAccountList(GetInsuranceFundAccountListReq) returns (GetInsuranceFundAccountListResp);
  rpc GetMarketSnapshotList(GetMarketSnapshotListReq) returns (GetMarketSnapshotListResp);
}

message CommonResp {
  common.RespBase base = 1;
}

message CreateSymbolReq {
  int64 tenant_id = 1;
  string symbol = 2;
  string display_symbol = 3;
  common.ProductType product_type = 4;
  int64 category_type = 30;
  string market = 31;
  string base_asset = 5;
  string quote_asset = 6;
  string settle_asset = 7;
  common.ContractType contract_type = 8;
  ContractValueType contract_value_type = 24;
  string margin_asset = 25;
  SymbolStatus status = 9;
  int64 price_scale = 10;
  int64 qty_scale = 11;
  string min_price = 12;
  string max_price = 13;
  string price_tick = 14;
  string min_qty = 15;
  string max_qty = 16;
  string qty_step = 17;
  string min_notional = 18;
  string max_notional = 19;
  int64 listing_time = 20;
  int64 trading_start_time = 21;
  int64 sort = 22;
  string remark = 23;
  int64 trading_end_time = 26;
}

message UpdateSymbolReq {
  int64 tenant_id = 1;
  int64 id = 2;
  int64 category_type = 30;
  string display_symbol = 3;
  SymbolStatus status = 4;
  int64 price_scale = 5;
  int64 qty_scale = 6;
  string min_price = 7;
  string max_price = 8;
  string price_tick = 9;
  string min_qty = 10;
  string max_qty = 11;
  string qty_step = 12;
  string min_notional = 13;
  string max_notional = 14;
  int64 listing_time = 15;
  int64 trading_start_time = 16;
  int64 sort = 17;
  string remark = 18;
  int64 trading_end_time = 19;
}

message GetSymbolListAdminReq {
  int64 tenant_id = 1;
  common.PageReq page = 2;
  common.ProductType product_type = 3;
  SymbolStatus status = 4;
  string keyword = 5;
  int64 category_type = 6;
  string market = 7;
}

message GetSymbolListAdminResp {
  common.RespBase base = 1;
  repeated TradeSymbol data = 2;
}

message GetSymbolDetailAdminReq {
  int64 tenant_id = 1;
  int64 id = 2;
}

message GetSymbolDetailAdminResp {
  common.RespBase base = 1;
  GetSymbolDetailAdminData data = 2;
}

message GetSymbolDetailAdminData {
  TradeSymbol symbol = 1;
  repeated TradeSymbolLeverageConfig leverage_configs = 2;
  TradeSymbolSpot spot = 3;
  TradeSymbolContract contract = 4;
  repeated TradeSymbolSeconds seconds_configs = 5;
  repeated TradeSymbolSession sessions = 6;
}

message SetSpotSymbolConfigReq {
  int64 tenant_id = 1;
  int64 symbol_id = 2;
  string maker_fee_rate = 3;
  string taker_fee_rate = 4;
  common.Enable buy_enabled = 5; // 状态,0表示全部，1表示启用，2表示禁用
  common.Enable sell_enabled = 6; // 状态,0表示全部，1表示启用，2表示禁用
}

message SetContractSymbolConfigReq {
  int64 tenant_id = 1;
  int64 symbol_id = 2;
  string contract_size = 3;
  string multiplier = 4;
  string maintenance_margin_rate = 5;
  string initial_margin_rate = 6;
  string maker_fee_rate = 7;
  string taker_fee_rate = 8;
  int64 funding_interval_minutes = 9;
  int64 delivery_time = 10;
  int64 support_cross = 11;
  int64 support_isolated = 12;
  common.Enable open_long_enabled = 13;
  common.Enable open_short_enabled = 14;
  string funding_rate_cap = 15;
  string funding_rate_floor = 16;
  string index_symbol = 17;
  string mark_price_source = 18;
  string settlement_price_source = 19;
  common.Enable close_long_enabled = 20;
  common.Enable close_short_enabled = 21;
  string funding_rate_source = 22;
  int64 open_cutoff_time = 23;
  int64 matching_stop_time = 24;
  int64 settlement_window_seconds = 25;
  string settlement_price_algorithm = 26;
  string delivery_fee_rate = 27;
  string liquidation_fee_rate = 28;
}

message SetSecondsSymbolConfigReq {
  int64 tenant_id = 1;
  int64 symbol_id = 2;
  int64 duration_seconds = 3;
  string payout_rate = 4;
  SecondsDrawRule draw_rule = 5;
  string start_price_source = 6;
  string settlement_price_source = 7;
  int64 quote_validity_ms = 8;
  string min_stake = 9;
  string max_stake = 10;
  common.Enable up_enabled = 11;
  common.Enable down_enabled = 12;
