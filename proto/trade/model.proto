message TradeOrderSeconds {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 order_id = 3;
  SecondsDirection direction = 4;
  int64 duration_seconds = 5;
  string stake_asset = 6;
  string stake_amount = 7;
  string payout_rate = 8;
  string start_price = 9;
