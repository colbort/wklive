syntax = "proto3";

package trade;

option go_package = "wklive/proto/trade;trade";

import "proto/common/common.proto";
import "proto/trade/enum.proto";

message TenantReq { int64 tenant_id = 1; }

message UserReq {
  int64 tenant_id = 1;
  int64 user_id = 2;
}

message TimeRange {
  int64 start_time = 1;
  int64 end_time = 2;
}

message DecimalRange {
  string min = 1;
  string max = 2;
}

message StringValues { repeated string values = 1; }

message Uint64Values { repeated int64 values = 1; }

message TradeSymbol {
  int64 id = 1;
  int64 tenant_id = 2;
  string symbol = 3;
  string display_symbol = 4;
  ProductType product_type = 5;
  string base_asset = 6;
  string quote_asset = 7;
  string settle_asset = 8;
  ContractType contract_type = 9;
  ContractValueType contract_value_type = 27;
  string margin_asset = 28;
  SymbolStatus status = 10;
  int64 price_scale = 11;
  int64 qty_scale = 12;
  string min_price = 13;
  string max_price = 14;
  string price_tick = 15;
  string min_qty = 16;
  string max_qty = 17;
  string qty_step = 18;
  string min_notional = 19;
  string max_notional = 20;
  int64 listing_time = 21;
  int64 trading_start_time = 22;
  int64 sort = 23;
  string remark = 24;
  int64 create_times = 25;
  int64 update_times = 26;
  int64 trading_end_time = 29;
}

message TradeSymbolSpot {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 symbol_id = 3;
  string maker_fee_rate = 4;
  string taker_fee_rate = 5;
  common.Enable buy_enabled = 6; // 状态,0表示全部，1表示启用，2表示禁用
  common.Enable sell_enabled = 7; // 状态,0表示全部，1表示启用，2表示禁用
  int64 create_times = 8;
  int64 update_times = 9;
}

message TradeSymbolContract {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 symbol_id = 3;
  string contract_size = 4;
  string multiplier = 5;
  string maintenance_margin_rate = 6;
  string initial_margin_rate = 7;
  string maker_fee_rate = 8;
  string taker_fee_rate = 9;
  int64 funding_interval_minutes = 10;
  int64 delivery_time = 11;
  int64 support_cross = 12;
  int64 support_isolated = 13;
  int64 create_times = 16;
  int64 update_times = 17;
  string funding_rate_cap = 18;
  string funding_rate_floor = 19;
  string index_symbol = 20;
  string mark_price_source = 21;
  string settlement_price_source = 22;
  common.Enable open_long_enabled = 23;
  common.Enable open_short_enabled = 24;
  common.Enable close_long_enabled = 25;
  common.Enable close_short_enabled = 26;
  string funding_rate_source = 27;
  int64 open_cutoff_time = 28;
  int64 matching_stop_time = 29;
  int64 settlement_window_seconds = 30;
  string settlement_price_algorithm = 31;
  string delivery_fee_rate = 32;
  string liquidation_fee_rate = 33;
  reserved 14, 15;
}

message TradeSymbolSeconds {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 symbol_id = 3;
  int64 duration_seconds = 4;
  string payout_rate = 5;
  SecondsDrawRule draw_rule = 6;
  string start_price_source = 7;
  string settlement_price_source = 8;
  int64 quote_validity_ms = 9;
  string min_stake = 10;
  string max_stake = 11;
  common.Enable up_enabled = 12;
  common.Enable down_enabled = 13;
  int64 create_times = 14;
  int64 update_times = 15;
  string fee_rate = 16;
  int64 settlement_window_ms = 17;
  string settlement_price_algorithm = 18;
  string draw_tolerance = 19;
  string max_exposure_amount = 20;
}

message TradeSymbolSession {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 symbol_id = 3;
  int64 day_of_week = 4;
  int64 start_second = 5;
  int64 end_second = 6;
  string timezone = 7;
  common.Enable enabled = 8;
}

message TradeUserConfig {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 user_id = 3;
  ProductType product_type = 4;
  int64 symbol_id = 5;
  common.Enable trade_enabled = 9; // 状态,0表示全部，1表示启用，2表示禁用
  int64 create_times = 11;
  int64 update_times = 12;
  reserved 6, 7, 8, 10;
}

message ContractUserConfig {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 user_id = 3;
  int64 symbol_id = 4;
  PositionMode position_mode = 5;
  MarginMode margin_mode = 6;
  int64 default_leverage = 7;
  int64 create_times = 9;
  int64 update_times = 10;
  reserved 8;
}

message TradeOrder {
  int64 id = 1;
  int64 tenant_id = 2;
  string order_no = 3;
  string client_order_id = 4;
  int64 user_id = 5;
  int64 symbol_id = 6;
  ProductType product_type = 7;
  common.Side side = 8; // 买卖方向
  PositionSide position_side = 9;
  OrderType order_type = 10;
  TimeInForce time_in_force = 11;
  OrderStatus status = 12;
  string price = 13;
  string qty = 14;
  string amount = 15;
  string filled_qty = 16;
  string filled_amount = 17;
  string avg_price = 18;
  string fee = 19;
  string fee_asset = 20;
  OrderSourceType source = 21;
  common.YesNo is_reduce_only = 22;
  string trigger_price = 24;
  TriggerType trigger_type = 25;
  string cancel_reason = 26;
  string biz_ext = 27;
  int64 create_times = 28;
  int64 update_times = 29;
  TriggerKind trigger_kind = 30;
  ContractType contract_type = 31;
  ContractValueType contract_value_type = 32;
  string request_hash = 33;
  string canceled_qty = 34;
  common.YesNo is_close_position = 35;
  string oco_group_no = 36;
  int64 expire_at = 37;
  int64 triggered_at = 38;
  string completion_reason = 39;
  int64 version = 40;
  reserved 23;
}

message TradeOrderSpot {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 order_id = 3;
  string frozen_asset = 4;
  string frozen_amount = 5;
  string settle_asset = 6;
  string settle_amount = 7;
  int64 create_times = 8;
  int64 update_times = 9;
}

message TradeOrderContract {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 order_id = 3;
  MarginMode margin_mode = 4;
  int64 leverage = 5;
  string margin_asset = 6;
  string margin_amount = 7;
  ClosePositionType close_position_type = 8;
  string liquidation_price = 9;
  string take_profit_price = 10;
  string stop_loss_price = 11;
  int64 create_times = 12;
  int64 update_times = 13;
  string reserved_close_qty = 14;
