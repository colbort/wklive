  string settlement_price_source = 24;
  string price_algorithm = 25;
  string profit_amount = 26;
  string fee_amount = 27;
  string settlement_reason = 28;
  int64 settled_at = 29;
  int64 version = 30;
}

message TradeFill {
  int64 id = 1;
  int64 tenant_id = 2;
  string fill_no = 3;
  int64 order_id = 4;
  string order_no = 5;
  int64 user_id = 6;
  int64 symbol_id = 7;
