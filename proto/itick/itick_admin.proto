syntax = "proto3";

package itick;

import "proto/common/common.proto";
import "proto/itick/enum.proto";
import "proto/itick/model.proto";

option go_package = "wklive/proto/itick;itick";

message AdminCommonResp { common.RespBase base = 1; }

// ====================
// 产品类型
// ====================

message CreateCategoryReq {
  itick.CategoryType category_type = 1;
  string category_name = 2;
  common.Enable enabled = 3;     // 启用状态 0表示全部，1表示启用，2表示禁用
  common.Switch app_visible = 4; // APP可见开关 0表示全部，1表示显示，2表示隐藏
  itick.SyncKlinePriority sync_priority = 5; // K线同步优先级  
  int64 sort = 6;
  string icon = 7;
  string remark = 8;
}

message UpdateCategoryReq {
  int64 id = 1;
  string category_name = 2;
  common.Enable enabled = 3;     // 启用状态 0表示全部，1表示启用，2表示禁用
  common.Switch app_visible = 4; // APP可见开关 0表示全部，1表示显示，2表示隐藏
  itick.SyncKlinePriority sync_priority = 5; // K线同步优先级  
  int64 sort = 6;
  string icon = 7;
  string remark = 8;
}

message GetCategoryReq { int64 id = 1; }

message GetCategoryResp {
  common.RespBase base = 1;
  itick.ItickCategory data = 2;
}

message ListCategoriesReq {
  common.PageReq page = 1;
  itick.CategoryType category_type = 2;
  common.Enable enabled = 3;     // 启用状态,0全部 1启用 2禁用
  common.Switch app_visible = 4; // APP可见开关,0全部 1可见 2隐藏
}

message ListCategoriesResp {
  common.RespBase base = 1;
  repeated itick.ItickCategory data = 2;
}

message SyncCategoryProductsReq { int64 id = 1; }

message SyncCategoryProductsResp {
  common.RespBase base = 1;
  string data = 2;
}

message GetSyncTaskStatusReq { string task_no = 1; }

message GetSyncTaskStatusResp {
  common.RespBase base = 1;
  GetSyncTaskStatusData data = 2;
}

message GetSyncTaskStatusData {
  string task_no = 1;
  int32 status = 2;
  string message = 3;
}

// ====================
// 产品
// ====================

message CreateProductReq {
  itick.CategoryType category_type = 1;
  string market = 2;
  string symbol = 3;
  string code = 4;
  string name = 5;
  string display_name = 6;
  string base_coin = 7;
  string quote_coin = 8;
  common.Enable enabled = 9;      // 启用状态 0表示全部，1表示启用，2表示禁用
  common.Switch app_visible = 10; // APP可见开关 0表示全部，1表示显示，2表示隐藏
  itick.SyncKlinePriority sync_priority = 11; // K线同步优先级  
  int64 sort = 12;
  string icon = 13;
  string remark = 14;
}

message UpdateProductReq {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string display_name = 4;
  string base_coin = 5;
  string quote_coin = 6;
  common.Enable enabled = 7;     // 启用状态 0表示全部，1表示启用，2表示禁用
  common.Switch app_visible = 8; // APP可见开关 0表示全部，1表示显示，2表示隐藏
  itick.SyncKlinePriority sync_priority = 9; // K线同步优先级  
  int64 sort = 10;
  string icon = 11;
  string remark = 12;
}

message GetProductReq { int64 id = 1; }

message GetProductResp {
  common.RespBase base = 1;
  itick.ItickProduct data = 2;
}

message ListProductsReq {
  common.PageReq page = 1;
  itick.CategoryType category_type = 2;
  string category_name = 3;
  string market = 4;
  string keyword = 5;
  common.Enable enabled = 6;     // 启用状态,0全部 1启用 2禁用
  common.Switch app_visible = 7; // APP可见开关,0全部 1显示 2隐藏
  string symbol = 8;
}

message ListProductsResp {
  common.RespBase base = 1;
  repeated itick.ItickProduct data = 2;
}

// ====================
// K线
// ====================

message GetProductKlineReq {
  string category_code = 1;
  string market = 2;
  string symbol = 3;
  itick.KlineType k_type = 4;
  int64 end_ts = 5;
  int64 limit = 6;
}

message GetProductKlineResp {
  common.RespBase base = 1;
  repeated itick.Kline data = 2;
}

message SyncProductKlineHistoryReq {
  string category_code = 1;
  string market = 2;
  string symbol = 3;
  itick.KlineType k_type = 4;
  int64 end_ts = 5;
}

message SyncProductKlineHistoryResp {
  common.RespBase base = 1;
  int64 synced_count = 2;
}

// ====================
// tenant product market
// ====================

message CreateTenantCategoryReq {
  int64 tenant_id = 1;
  int64 category_id = 2;
  common.Enable enabled = 3;     // 启用状态 0表示全部，1表示启用，2表示禁用
  common.Switch app_visible = 4; // APP可见开关 0表示全部，1表示显示，2表示隐藏
  int64 sort = 5;
  string remark = 6;
}

message UpdateTenantCategoryReq {
  int64 id = 1;
  int64 tenant_id = 2;
  common.Enable enabled = 3;     // 启用状态 0表示全部，1表示启用，2表示禁用
  common.Switch app_visible = 4; // APP可见开关 0表示全部，1表示显示，2表示隐藏
  int64 sort = 5;
  string remark = 6;
}

message BatchUpsertTenantCategoriesReq {
  int64 tenant_id = 1;
  repeated TenantCategoryItem data = 2;
}

message TenantCategoryItem {
  int64 id = 1;
  int64 category_id = 2;
  common.Enable enabled = 3;     // 启用状态 0表示全部，1表示启用，2表示禁用
  common.Switch app_visible = 4; // APP可见开关 0表示全部，1表示显示，2表示隐藏
  int64 sort = 5;
  string remark = 6;
}

message GetTenantCategoryReq {
  int64 id = 1;
  int64 tenant_id = 2;
}

message GetTenantCategoryResp {
  common.RespBase base = 1;
  itick.ItickTenantCategory data = 2;
}

message ListTenantCategoriesReq {
  common.PageReq page = 1;
  int64 tenant_id = 2;
  itick.CategoryType category_type = 3;
  common.Enable enabled = 4;        // 启用状态,0全部 1启用 2禁用
  common.Switch visible_status = 5; // 可见开关,0全部 1显示 2隐藏
}

message ListTenantCategoriesResp {
  common.RespBase base = 1;
  repeated itick.ItickTenantCategory data = 2;
}

// ====================
// tenant product
// ====================

message CreateTenantProductReq {
  int64 tenant_id = 1;
  int64 product_id = 2;
  common.Enable enabled = 3;     // 启用状态 0表示全部，1表示启用，2表示禁用
  common.Switch app_visible = 4; // APP可见开关 0表示全部，1表示显示，2表示隐藏
  int64 sort = 5;
  string remark = 6;
}

message UpdateTenantProductReq {
  int64 id = 1;
  int64 tenant_id = 2;
  common.Enable enabled = 3;     // 启用状态 0表示全部，1表示启用，2表示禁用
  common.Switch app_visible = 4; // APP可见开关 0表示全部，1表示显示，2表示隐藏
  int64 sort = 5;
  string remark = 6;
}

message BatchUpsertTenantProductsReq {
  int64 tenant_id = 1;
  repeated TenantProductItem data = 2;
}

message TenantProductItem {
  int64 id = 1;
  int64 product_id = 2;
  common.Enable enabled = 3;     // 启用状态 0表示全部，1表示启用，2表示禁用
  common.Switch app_visible = 4; // APP可见开关 0表示全部，1表示显示，2表示隐藏
  int64 sort = 5;
  string remark = 6;
}

message GetTenantProductReq {
  int64 id = 1;
  int64 tenant_id = 2;
}

message GetTenantProductResp {
  common.RespBase base = 1;
  itick.ItickTenantProduct data = 2;
}

message ListTenantProductsReq {
  common.PageReq page = 1;
  int64 tenant_id = 2;
  itick.CategoryType category_type = 3;
  string market = 4;
  string keyword = 5;
  common.Enable enabled = 6;         // 启用状态,0全部 1启用 2禁用
  common.Switch app_visible = 7; // 可见开关,0全部 1显示 2隐藏
}

message ListTenantProductsResp {
  common.RespBase base = 1;
  repeated itick.ItickTenantProduct data = 2;
}

// ====================
// tenant init
// ====================

message InitTenantItickDisplayReq {
  int64 tenant_id = 1;
  int64 overwrite = 2; // 是否覆盖已有配置
}

message InitTenantItickDisplayResp {
  common.RespBase base = 1;
  InitTenantItickDisplayData data = 2;
}

message InitTenantItickDisplayData {
  int64 category_count = 1;
  int64 product_count = 2;
}

// ====================
// Versioned Price Engine formulas
// ====================

message PriceFormulaComponent {
  string authority = 1;
  string snapshot_kind = 2;
  string category_code = 3;
  string market = 4;
  string symbol = 5;
  string weight = 6;
}

message CreatePriceFormulaReq {
  string formula_no = 1;
  string authority = 2;
  string snapshot_kind = 3;
  string category_code = 4;
  string market = 5;
  string symbol = 6;
  string algorithm = 7;
  string formula_version = 8;
  repeated PriceFormulaComponent components = 9;
  int64 max_lookback_ms = 10;
  int64 max_deviation_bps = 11;
  int64 interval_ms = 12;
  bool activate = 13;
}

message PriceFormulaReq { int64 id = 1; }

message ChangePriceFormulaStatusReq {
  int64 id = 1;
  int32 status = 2; // 1 activate, 3 revoke; revoke is irreversible
}

message ListPriceFormulasReq {
  common.PageReq page = 1;
  string authority = 2;
  string snapshot_kind = 3;
  string category_code = 4;
  string market = 5;
  string symbol = 6;
  int32 status = 7;
}

message PriceFormulaData {
  int64 id = 1;
  string formula_no = 2;
  string authority = 3;
  string snapshot_kind = 4;
  string category_code = 5;
  string market = 6;
  string symbol = 7;
  string algorithm = 8;
  string formula_version = 9;
  repeated PriceFormulaComponent components = 10;
  int64 max_lookback_ms = 11;
  int64 max_deviation_bps = 12;
  int64 interval_ms = 13;
  int64 last_target_time = 14;
  int32 status = 15;
  int64 version = 16;
  int64 create_times = 17;
  int64 update_times = 18;
}

message PriceFormulaResp {
  common.RespBase base = 1;
  PriceFormulaData data = 2;
}

message ListPriceFormulasResp {
  common.RespBase base = 1;
  repeated PriceFormulaData data = 2;
}

message ListSnapshotOutboxReq {
  common.PageReq page = 1;
  int32 status = 2;
  string snapshot_id = 3;
}

message SnapshotOutboxData {
  int64 id = 1;
  string snapshot_id = 2;
  int32 status = 3;
  int64 retry_count = 4;
  int64 next_retry_at = 5;
  string last_error_msg = 6;
  int64 create_times = 7;
  int64 update_times = 8;
}

message ListSnapshotOutboxResp {
  common.RespBase base = 1;
  repeated SnapshotOutboxData data = 2;
}

message RetrySnapshotOutboxReq { int64 id = 1; }

message RevokeAuthoritativeSnapshotReq {
  string snapshot_id = 1;
  string replacement_snapshot_id = 2;
  string reason = 3;
}

// ====================
// admin service
// ====================
service ItickAdmin {
  // 产品类型列表
  rpc ListCategories(ListCategoriesReq) returns (ListCategoriesResp);
  // 产品类型
  rpc CreateCategory(CreateCategoryReq) returns (AdminCommonResp);
  // 更新产品类型仅允许更新名称、状态、排序、图标和备注，产品类型不允许修改
  rpc UpdateCategory(UpdateCategoryReq) returns (AdminCommonResp);
  // 获取产品类型详情
  rpc GetCategory(GetCategoryReq) returns (GetCategoryResp);
  // 同步类型下的产品
  rpc SyncCategoryProducts(SyncCategoryProductsReq)
      returns (SyncCategoryProductsResp);
  // 获取同步任务状态
  rpc GetSyncTaskStatus(GetSyncTaskStatusReq) returns (GetSyncTaskStatusResp);

  // 产品列表
  rpc ListProducts(ListProductsReq) returns (ListProductsResp);
  // 产品
  rpc CreateProduct(CreateProductReq) returns (AdminCommonResp);
  // 更新产品仅允许更新名称、状态、排序、图标和备注，市场、品种、代码不允许修改
  rpc UpdateProduct(UpdateProductReq) returns (AdminCommonResp);
  // 获取产品详情
  rpc GetProduct(GetProductReq) returns (GetProductResp);

  // K线查看
  rpc GetProductKline(GetProductKlineReq) returns (GetProductKlineResp);
  // 从 iTick 获取指定产品历史 K 线并写入 MongoDB
  rpc SyncProductKlineHistory(SyncProductKlineHistoryReq)
      returns (SyncProductKlineHistoryResp);

  // 租户产品类型列表
  rpc ListTenantCategories(ListTenantCategoriesReq)
      returns (ListTenantCategoriesResp);
  // 租户产品类型
  rpc CreateTenantCategory(CreateTenantCategoryReq) returns (AdminCommonResp);
  // 更新租户产品类型仅允许更新状态、排序和备注，关联的产品类型不允许修改
  rpc UpdateTenantCategory(UpdateTenantCategoryReq) returns (AdminCommonResp);
  // 批量更新租户产品类型，已关联的修改状态、排序和备注，未关联的新增，未提交的删除
  rpc BatchUpsertTenantCategories(BatchUpsertTenantCategoriesReq)
      returns (AdminCommonResp);
  // 获取租户产品类型详情
  rpc GetTenantCategory(GetTenantCategoryReq) returns (GetTenantCategoryResp);

  // 租户产品列表
  rpc ListTenantProducts(ListTenantProductsReq)
      returns (ListTenantProductsResp);
  // 租户产品
  rpc CreateTenantProduct(CreateTenantProductReq) returns (AdminCommonResp);
  // 更新租户产品仅允许更新状态、排序和备注，关联的产品不允许修改
  rpc UpdateTenantProduct(UpdateTenantProductReq) returns (AdminCommonResp);
  // 批量更新租户产品，已关联的修改状态、排序和备注，未关联的新增，未提交的删除
  rpc BatchUpsertTenantProducts(BatchUpsertTenantProductsReq)
      returns (AdminCommonResp);
  // 获取租户产品详情
  rpc GetTenantProduct(GetTenantProductReq) returns (GetTenantProductResp);

  // 初始化租户展示配置
  rpc InitTenantItickDisplay(InitTenantItickDisplayReq)
      returns (InitTenantItickDisplayResp);

  // Price Engine 公式内容不可原地修改，变更必须创建新版本。
  rpc CreatePriceFormula(CreatePriceFormulaReq) returns (PriceFormulaResp);
  rpc GetPriceFormula(PriceFormulaReq) returns (PriceFormulaResp);
  rpc ListPriceFormulas(ListPriceFormulasReq) returns (ListPriceFormulasResp);
  rpc ChangePriceFormulaStatus(ChangePriceFormulaStatusReq)
      returns (AdminCommonResp);
  rpc ListSnapshotOutbox(ListSnapshotOutboxReq)
      returns (ListSnapshotOutboxResp);
  rpc RetrySnapshotOutbox(RetrySnapshotOutboxReq) returns (AdminCommonResp);
  rpc RevokeAuthoritativeSnapshot(RevokeAuthoritativeSnapshotReq)
      returns (AdminCommonResp);
}
