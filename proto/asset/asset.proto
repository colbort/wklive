  string amount = 3; // 解锁金额
  string biz_no = 4; // 业务单号
  string remark = 5; // 备注
  int64 operator_id = 6; // 操作人ID
}

message ManualChangeAssetResp {
  common.RespBase base = 1;
  ManualChangeAssetData data = 2;
}

message ManualChangeAssetData {
  string biz_no = 1;
  UserAsset asset = 2;
}

// 内部资产服务
service Asset {
  // 增加可用余额
  rpc AddAvailable(AddAvailableReq) returns (ChangeAssetResp);

  // 扣减可用余额
  rpc SubAvailable(SubAvailableReq) returns (ChangeAssetResp);

  // 冻结余额
  rpc FreezeAsset(FreezeAssetReq) returns (FreezeAssetResp);

  // 解冻余额
  rpc UnfreezeAsset(UnfreezeAssetReq) returns (ChangeAssetResp);

  // 按业务单号解冻余额
  rpc UnfreezeAssetByBizNo(UnfreezeAssetByBizNoReq) returns (ChangeAssetResp);

  // 扣减冻结余额
  rpc DeductFrozenAsset(DeductFrozenAssetReq) returns (ChangeAssetResp);

  // 按业务单号扣减冻结余额
  rpc DeductFrozenAssetByBizNo(DeductFrozenAssetByBizNoReq) returns (ChangeAssetResp);

  // 锁仓
  rpc LockAsset(LockAssetReq) returns (LockAssetResp);

  // 解锁
  rpc UnlockAsset(UnlockAssetReq) returns (ChangeAssetResp);

  // 按业务单号解锁
  rpc UnlockAssetByBizNo(UnlockAssetByBizNoReq) returns (ChangeAssetResp);

  // 扣减锁仓余额
  rpc DeductLockedAsset(DeductLockedAssetReq) returns (ChangeAssetResp);

  // 按业务单号扣减锁仓余额
  rpc DeductLockedAssetByBizNo(DeductLockedAssetByBizNoReq) returns (ChangeAssetResp);

  // 钱包划转
  rpc TransferAsset(TransferAssetReq) returns (TransferAssetResp);

  // 从租户保险基金账户原子扣减，余额不足时允许部分赔付。
  rpc CoverInsuranceDeficit(CoverInsuranceDeficitReq) returns (CoverInsuranceDeficitResp);
  rpc ReverseInsuranceCover(ReverseInsuranceCoverReq) returns (ChangeAssetResp);

  // 将业务手续费原子、幂等计入租户平台手续费收入账户。
  rpc CreditPlatformRevenue(CreditPlatformRevenueReq) returns (CreditPlatformRevenueResp);
}

