name: RPC dependency check

on:
  pull_request:
  push:

jobs:
  rpc-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check allowlist and cycles
        run: sh services/scripts/check-rpc-dependencies.sh
