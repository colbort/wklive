Name: trade.rpc
ListenOn: 0.0.0.0:8087
MQ:
  Brokers: [kafka:9092]
  MaxAttempts: 5
Mode: dev
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: trade.rpc

AssetRpc:
  rpcType: zrpc
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: asset.rpc

ItickRpc:
  rpcType: zrpc
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: itick.rpc

MarketAuthority: itick-ws
PriceEngineAuthority: price-engine

DelayQueue:
  Enabled: true
  Beanstalks:
  - Endpoint: 127.0.0.1:11300
    Tube: trade-seconds
  - Endpoint: 127.0.0.1:11301
    Tube: trade-seconds

LiquidityOrderArchive:
  Enabled: true
  RetentionDays: 30
  BatchSize: 500
