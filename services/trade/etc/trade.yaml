Name: trade.rpc
ListenOn: 0.0.0.0:8087
Mode: dev
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: trade.rpc

AssetRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: asset.rpc

ItickRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: itick.rpc

MarketAuthority: itick-ws
PriceEngineAuthority: price-engine

DelayQueue:
  Enabled: true
  Beanstalks:
  - Endpoint: 127.0.0.1:11300
    Tube: trade-seconds
  - Endpoint: 127.0.0.1:11301
    Tube: trade-seconds

LiquidityOrderArchive:
  Enabled: true
  RetentionDays: 30
  BatchSize: 500

# P1-02 隔离验收已完成；生产价格源、告警、保险账户和资金权限
# 获批并演练前仍必须保持 false。false 时只生成待人工处理事实。
AutomaticLiquidation:
  Enabled: false

# 全仓下单资金闭环验收完成后再由发布审批打开；平仓不受此开关影响。
# 新增全仓风险敞口还会同时要求 AutomaticLiquidation.Enabled=true。
CrossMarginTrading:
  Enabled: false
