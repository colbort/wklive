Name: trade.rpc
ListenOn: 0.0.0.0:8087
Mode: dev
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: trade.rpc

AssetRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: asset.rpc

ItickRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: itick.rpc

MarketAuthority: itick-ws
PriceEngineAuthority: price-engine

DelayQueue:
  Enabled: true
  Beanstalks:
  - Endpoint: 127.0.0.1:11300
    Tube: trade-seconds
  - Endpoint: 127.0.0.1:11301
    Tube: trade-seconds

LiquidityOrderArchive:
  Enabled: true
  RetentionDays: 30
  BatchSize: 500

# P1-02 完成前必须保持 false；false 时仅生成待人工处理的强平事实，
# 不会自动执行保险基金赔付或 ADL。
AutomaticLiquidation:
  Enabled: false
