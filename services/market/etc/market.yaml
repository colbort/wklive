Name: market.rpc
ListenOn: 0.0.0.0:8082
Mode: pro
MethodTimeouts:
  - FullMethod: /market.MarketAdmin/SyncProductKlineHistory
    Timeout: 5m
  - FullMethod: /market.MarketAdmin/ListProducts
    Timeout: 5m
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: market.rpc
Market:
  ApiUrl: https://api.market.org
  WSUrl: wss://api.market.org
  Token: "__ITICK_TOKEN__"
  # 所有 iTick REST 接口共享这一份全局额度，不区分请求路径。
  RestRateLimitPerMinute: 100
  RestRateLimitBurst: 1

Runtime:
  ReconcileIntervalMinutes: 5
  ReconcileWindowBars: 30
  GapScanIntervalMinutes: 60
  RepairBatchSize: 10
  BuildingBucketTtlMinutes: 120
  WsKlineStaleSeconds: 30

# 三个独立交易所的公开现货成交价用于 INDEX/DELIVERY；Binance 永续成交价
# 单独用于 MARK 基差。全部端点无需 API Key，但生产数据许可仍须单独审批。
ExternalQuotes:
  - Enabled: true
    Authority: binance-public
    ProviderCode: BINANCE
    Adapter: BINANCE_SPOT_AGG_TRADES
    BaseURL: https://api.binance.com/api/v3/aggTrades
    CategoryCode: crypto
    Market: BINANCE
    Symbol: BTCUSDT
    UpstreamSymbol: BTCUSDT
    IntervalMs: 1000
    TimeoutMs: 3000
    MaxSourceAgeMs: 30000
    MaxFutureSkewMs: 5000
  - Enabled: true
    Authority: okx-public
    ProviderCode: OKX
    Adapter: OKX_SPOT_TICKER
    BaseURL: https://www.okx.com/api/v5/market/ticker
    CategoryCode: crypto
    Market: OKX
    Symbol: BTCUSDT
    UpstreamSymbol: BTC-USDT
    IntervalMs: 1000
    TimeoutMs: 3000
    MaxSourceAgeMs: 30000
    MaxFutureSkewMs: 5000
  - Enabled: true
    Authority: bybit-public
    ProviderCode: BYBIT
    Adapter: BYBIT_SPOT_RECENT_TRADE
    BaseURL: https://api.bybit.com/v5/market/recent-trade
    CategoryCode: crypto
    Market: BYBIT
    Symbol: BTCUSDT
    UpstreamSymbol: BTCUSDT
    IntervalMs: 1000
    TimeoutMs: 3000
    MaxSourceAgeMs: 30000
    MaxFutureSkewMs: 5000
  - Enabled: true
    Authority: binance-futures-public
    ProviderCode: BINANCE
    Adapter: BINANCE_FUTURES_AGG_TRADES
    BaseURL: https://fapi.binance.com/fapi/v1/aggTrades
    CategoryCode: crypto
    Market: BINANCE_PERP
    Symbol: BTCUSDT
    UpstreamSymbol: BTCUSDT
    IntervalMs: 1000
    TimeoutMs: 3000
    MaxSourceAgeMs: 30000
    MaxFutureSkewMs: 5000

Mongo:
  Url: "mongodb://root:openIM123@127.0.0.1:27017/stock?authSource=admin"
  Db: "wklive"

KlineWriter:
  QueueSize: 20000
  BatchSize: 300
  FlushIntervalMs: 1000
  WriteTimeoutMs: 5000

SnapshotOutbox:
  # 单实例并发发布数；积压较大时可按 Redis、Kafka 和 MySQL 容量调整。
  WorkerCount: 64
  # 单轮领取数，应不小于 WorkerCount。
  BatchSize: 512
  # 队列为空或不足一批时的轮询间隔，单位毫秒。
  IdleIntervalMs: 100

SnapshotOutboxCleanup:
  # status=3 的成功记录保留时间，单位分钟。
  SuccessRetentionMinutes: 30
  # 清理任务执行周期，单位秒。
  IntervalSeconds: 60
  # 单批最多删除数量，上限 10000。
  BatchSize: 5000
  # 单轮最多执行批次数，防止长时间占用数据库。
  MaxBatchesPerRun: 10
  # 相邻批次之间的等待时间，单位毫秒。
  BatchPauseMs: 100

AuthoritativeCache:
  # Redis 只保留最近 30 分钟的历史快照；更早的查询回源 MySQL。
  HotWindowMinutes: 30
  # 所有依赖方升级到 v3 并验证后再开启旧 v1/v2 Key 清理。
  LegacyCleanupEnabled: false
  # 每次 SCAN 的建议数量；SCAN 本身不保证精确返回该数量。
  LegacyCleanupScanCount: 500
  # 旧 Key 清理批次间隔，单位秒。
  LegacyCleanupIntervalSeconds: 1
