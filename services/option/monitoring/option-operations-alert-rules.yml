groups:
  - name: wklive-option-operations
    rules:
      - alert: OptionOperationsMetricsMissing
        expr: >-
          absent(wklive_option_operations_sample_success)
          or (wklive_option_operations_sample_success == 0)
          or (time() - wklive_option_operations_last_success_timestamp_seconds > 45)
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A008
        annotations:
          summary: Option 运营指标采样缺失或陈旧
          description: >-
            运营水位最近一次成功采样已超过45秒，或采样 SQL 失败。
            告警期间不得把缺失序列解释为异常已恢复。

      - alert: OptionAssetInstructionException
        expr: >-
          wklive_option_operations_count{
            category=~"asset_failed|asset_manual_review"
          } > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A006
        annotations:
          summary: Option 资产指令失败或进入人工处理
          description: >-
            tenant_id={{ $labels.tenant_id }}, category={{ $labels.category }},
            count={{ $value }}。

      - alert: OptionAssetInstructionStale
        expr: >-
          (wklive_option_operations_count{category="asset_pending"} > 0)
          and
          (time() - wklive_option_operations_oldest_timestamp_seconds{
            category="asset_pending"
          } > 60)
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A006
        annotations:
          summary: Option 资产指令积压超过60秒
          description: tenant_id={{ $labels.tenant_id }}，按原指令号检查和恢复。

      - alert: OptionMarginCoinEvidenceInvalid
        expr: >-
          wklive_option_operations_count{category="margin_coin_invalid"} > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A032
        annotations:
          summary: Option 保证金币种证据缺失或与合约不一致
          description: >-
            tenant_id={{ $labels.tenant_id }}，异常订单/保证金批次/活动资产指令数={{ $value }}。
            禁止按手续费币种猜测；暂停相关资金处理并按冻结业务号核对 Asset。

      - alert: OptionAssetFreezeBusinessKeyDuplicate
        expr: >-
          wklive_option_operations_count{category="asset_freeze_duplicate"} > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A033
        annotations:
          summary: Option 在 Asset 中存在重复冻结业务键
          description: >-
            tenant_id={{ $labels.tenant_id }}，重复冻结业务键数={{ $value }}。
            立即停止相关业务号的资金处理；禁止删除幂等行、改业务号或自动选择冻结记录。

      - alert: OptionReconciliationOpen
        expr: wklive_option_operations_count{category="reconciliation_open"} > 0
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A007
        annotations:
          summary: Option/Asset 存在开放对账差异
          description: tenant_id={{ $labels.tenant_id }}，开放差异数={{ $value }}。

      - alert: OptionRiskAccountStale
        expr: wklive_option_operations_count{category="risk_account_stale"} > 0
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A004
        annotations:
          summary: Option 风险账户扫描陈旧
          description: tenant_id={{ $labels.tenant_id }}，陈旧账户数={{ $value }}。

      - alert: OptionEventBacklogStale
        expr: >-
          (wklive_option_operations_count{
            category=~"outbox_pending|inbox_pending"
          } > 0)
          and
          (time() - wklive_option_operations_oldest_timestamp_seconds{
            category=~"outbox_pending|inbox_pending"
          } > 60)
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A008
        annotations:
          summary: Option 事务事件积压超过60秒
          description: >-
            tenant_id={{ $labels.tenant_id }}, category={{ $labels.category }},
            count={{ $value }}。

      - alert: OptionEventBacklogGrowing
        expr: >-
          delta(wklive_option_operations_count{
            category=~"outbox_pending|inbox_pending"
          }[1m]) > 0
        for: 3m
        labels:
          severity: warning
          catalog_id: OPT-A008
        annotations:
          summary: Option 事务事件积压连续增长
          description: >-
            tenant_id={{ $labels.tenant_id }}, category={{ $labels.category }}；
            最近一分钟净增长连续保持三分钟，请检查消费者吞吐和失败重试。

      - alert: OptionExerciseBacklogStale
        expr: >-
          (wklive_option_operations_count{category="exercise_pending"} > 0)
          and
          (time() - wklive_option_operations_oldest_timestamp_seconds{
            category="exercise_pending"
          } > 60)
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A009
        annotations:
          summary: Option 主动行权积压超过60秒
          description: tenant_id={{ $labels.tenant_id }}，待处理数={{ $value }}。

      - alert: OptionExercisePendingNearExpiry
        expr: >-
          wklive_option_operations_count{
            category="exercise_near_expiry"
          } > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A009
        annotations:
          summary: Option 到期前30分钟仍有待处理主动行权
          description: tenant_id={{ $labels.tenant_id }}，待处理行权数={{ $value }}。

      - alert: OptionSettlementException
        expr: wklive_option_operations_count{category="settlement_failed"} > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A012
        annotations:
          summary: Option 结算存在失败记录
          description: tenant_id={{ $labels.tenant_id }}，失败结算数={{ $value }}。

      - alert: OptionSettlementBacklogStale
        expr: >-
          (wklive_option_operations_count{category="settlement_pending"} > 0)
          and
          (time() - wklive_option_operations_oldest_timestamp_seconds{
            category="settlement_pending"
          } > 300)
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A012
        annotations:
          summary: Option 结算批次积压超过5分钟
          description: tenant_id={{ $labels.tenant_id }}，待处理结算数={{ $value }}。

      - alert: OptionLiquidationException
        expr: wklive_option_operations_count{category="liquidation_exception"} > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A013
        annotations:
          summary: Option 强平进入失败、破产或人工处理
          description: tenant_id={{ $labels.tenant_id }}，异常强平数={{ $value }}。

      - alert: OptionLiquidationBacklogStale
        expr: >-
          (wklive_option_operations_count{category="liquidation_pending"} > 0)
          and
          (time() - wklive_option_operations_oldest_timestamp_seconds{
            category="liquidation_pending"
          } > 60)
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A013
        annotations:
          summary: Option 强平积压超过60秒
          description: tenant_id={{ $labels.tenant_id }}，待处理强平数={{ $value }}。

      - alert: OptionPhysicalDeliveryException
        expr: >-
          wklive_option_operations_count{
            category="physical_delivery_exception"
          } > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A026
        annotations:
          summary: Option 实物交割存在补资、人工或违约单元
          description: tenant_id={{ $labels.tenant_id }}，异常单元数={{ $value }}。

      - alert: OptionPhysicalDeliveryOverdue
        expr: >-
          wklive_option_operations_count{
            category="physical_delivery_overdue"
          } > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A026
        annotations:
          summary: Option 实物交割已逾补资截止或进入违约
          description: tenant_id={{ $labels.tenant_id }}，逾期/违约单元数={{ $value }}。

      - alert: OptionUnresolvedDeficit
        expr: >-
          wklive_option_operations_amount{category="unresolved_deficit"} > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A014
        annotations:
          summary: Option 存在保险后未解决穿仓缺口
          description: >-
            tenant_id={{ $labels.tenant_id }}, coin={{ $labels.coin }},
            amount={{ $value }}。

      - alert: OptionTradingControlNotConfigured
        expr: >-
          wklive_option_operations_count{
            category=~"trading_control_unconfigured|control_not_configured_recent"
          } > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A017
        annotations:
          summary: Option 交易态合约控制参数缺失
          description: >-
            tenant_id={{ $labels.tenant_id }}, category={{ $labels.category }},
            count={{ $value }}；保持新单失败关闭。

      - alert: OptionPriceBandRejectionBurst
        expr: >-
          wklive_option_operations_count{
            category="price_band_contract_breach"
          } > 0
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A018
        annotations:
          summary: Option 合约一分钟价格带拒单超过20笔或占请求超过10%
          description: >-
            tenant_id={{ $labels.tenant_id }}，超绝对笔数或拒单比例阈值的合约组数={{ $value }}；
            从不可变交易控制事件下钻请求数、拒绝数和合约。

      - alert: OptionCircuitBreakerTriggered
        expr: >-
          wklive_option_operations_count{category="circuit_breaker_recent"} > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A019
        annotations:
          summary: Option 最近五分钟触发熔断
          description: tenant_id={{ $labels.tenant_id }}，熔断事件数={{ $value }}。

      - alert: OptionPausedContractActiveOrders
        expr: >-
          wklive_option_operations_count{
            category="paused_contract_active_orders"
          } > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A019
        annotations:
          summary: Option 暂停合约30秒后仍有活动或资金中订单
          description: tenant_id={{ $labels.tenant_id }}，受影响合约数={{ $value }}。

      - alert: OptionKillSwitchActiveOrders
        expr: >-
          wklive_option_operations_count{
            category="kill_switch_active_orders"
          } > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A020
        annotations:
          summary: Option kill switch 启用30秒后仍有活动或资金中订单
          description: tenant_id={{ $labels.tenant_id }}，受影响用户数={{ $value }}。

      - alert: OptionKillSwitchReleaseFailure
        expr: >-
          wklive_option_operations_count{
            category="kill_switch_release_failure"
          } > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A020
        annotations:
          summary: Option kill switch 撤单资金释放失败
          description: tenant_id={{ $labels.tenant_id }}，失败/人工资产指令数={{ $value }}。

      - alert: OptionSTPBurst
        expr: >-
          wklive_option_operations_count{
            category=~"stp_user_breach|stp_tenant_breach"
          } > 0
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A021
        annotations:
          summary: Option STP 五分钟窗口超过用户或租户阈值
          description: >-
            tenant_id={{ $labels.tenant_id }}, category={{ $labels.category }},
            affected={{ $value }}。

      - alert: OptionPositionLimitRejectionBurst
        expr: >-
          wklive_option_operations_count{
            category="position_limit_group_breach"
          } > 0
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A022
        annotations:
          summary: Option 用户/合约限额拒单五分钟超过20笔
          description: tenant_id={{ $labels.tenant_id }}，超阈值用户合约组数={{ $value }}。

      - alert: OptionTradeCorrectionException
        expr: >-
          wklive_option_operations_count{
            category="trade_correction_exception"
          } > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A023
        annotations:
          summary: Option 异常成交现金更正超龄或人工处理
          description: tenant_id={{ $labels.tenant_id }}，异常案件数={{ $value }}。

      - alert: OptionMMPException
        expr: >-
          wklive_option_operations_count{category="mmp_exception"} > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A024
        annotations:
          summary: Option MMP 残余报价、撤单错误或异常禁用
          description: tenant_id={{ $labels.tenant_id }}，异常报价组数={{ $value }}。

      - alert: OptionUnderlyingMarketStale
        expr: >-
          wklive_option_operations_count{
            category="underlying_market_stale"
          } > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A001
        annotations:
          summary: Option 交易合约标的行情缺失、陈旧或来自未来
          description: tenant_id={{ $labels.tenant_id }}，受影响合约数={{ $value }}。

      - alert: OptionMarkMarketStale
        expr: >-
          wklive_option_operations_count{category="mark_market_stale"} > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A002
        annotations:
          summary: Option 交易合约标记价缺失、陈旧或来自未来
          description: tenant_id={{ $labels.tenant_id }}，受影响合约数={{ $value }}。

      - alert: OptionGreeksMarketInvalid
        expr: >-
          wklive_option_operations_count{category="greeks_market_invalid"} > 0
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A003
        annotations:
          summary: Option 交易合约 Greeks 阈值未配置或时间戳无效/陈旧
          description: >-
            tenant_id={{ $labels.tenant_id }}，受影响合约数={{ $value }}；
            按合约核对 greeks_max_age_seconds、发布链路和最近快照时间。

      - alert: OptionRiskScanFailedGroups
        expr: wklive_option_risk_scan_failed_groups > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A005
        annotations:
          summary: Option 最近一次风险扫描存在失败钱包
          description: tenant_id={{ $labels.tenant_id }}，失败钱包数={{ $value }}。

      - alert: OptionRiskScanFailureRatioHigh
        expr: wklive_option_risk_scan_failure_ratio > 0.05
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A005
        annotations:
          summary: Option 最近一次风险扫描失败比例超过5%
          description: tenant_id={{ $labels.tenant_id }}，失败比例={{ $value }}。

      - alert: OptionRiskScanExecutionFailure
        expr: >-
          increase(wklive_option_risk_scan_execution_failure_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A005
        annotations:
          summary: Option 风险扫描在钱包计算前后发生执行失败
          description: >-
            tenant_scope={{ $labels.tenant_scope }}, stage={{ $labels.stage }},
            five_minute_failures={{ $value }}。

      - alert: OptionSettlementPriceOverdue
        expr: >-
          wklive_option_operations_count{
            category="settlement_price_overdue"
          } > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A010
        annotations:
          summary: Option 到期窗口结束60秒后仍无已确认结算价
          description: >-
            tenant_id={{ $labels.tenant_id }}，受影响合约数={{ $value }}；
            保持结算等待，不得使用当前价替代。

      - alert: OptionSettlementPriceInvalid
        expr: >-
          wklive_option_operations_count{
            category="settlement_price_invalid"
          } > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A011
        annotations:
          summary: Option 已确认结算价证据不符合合约规则
          description: >-
            tenant_id={{ $labels.tenant_id }}，异常快照数={{ $value }}；
            立即阻止相关结算批次。

      - alert: OptionPortfolioRiskConfigMissing
        expr: >-
          wklive_option_operations_count{
            category="portfolio_risk_config_missing"
          } > 0
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A025
        annotations:
          summary: Option 组合持仓缺少当前有效已批准风险参数
          description: >-
            tenant_id={{ $labels.tenant_id }}，受影响钱包/币种组数={{ $value }}；
            保持组合卖单失败关闭。

      - alert: OptionPortfolioRiskVersionMismatch
        expr: >-
          wklive_option_operations_count{
            category="portfolio_risk_version_mismatch"
          } > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A025
        annotations:
          summary: Option 风险账户使用的组合模型版本落后当前有效版本
          description: >-
            tenant_id={{ $labels.tenant_id }}，超两个扫描周期账户数={{ $value }}；
            保持风险限制并核对扫描器。

      - alert: OptionCorporateActionDue
        expr: >-
          wklive_option_operations_count{
            category="corporate_action_due"
          } > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A027
        annotations:
          summary: Option 公司行动生效后仍未完成
          description: >-
            tenant_id={{ $labels.tenant_id }}，到期事件数={{ $value }}；
            源合约保持停牌，后继合约不得上市。

      - alert: OptionCorporateActionException
        expr: >-
          wklive_option_operations_count{
            category="corporate_action_exception"
          } > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A027
        annotations:
          summary: Option 公司行动执行、映射或合约状态异常
          description: >-
            tenant_id={{ $labels.tenant_id }}，异常事件数={{ $value }}；
            检查人工态、失败持仓及源/后继合约门禁。

      - alert: OptionContractSeriesReviewStale
        expr: >-
          wklive_option_operations_count{
            category="contract_series_review_stale"
          } > 0
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A028
        annotations:
          summary: Option 合约系列待复核超过24小时
          description: tenant_id={{ $labels.tenant_id }}，积压系列数={{ $value }}。

      - alert: OptionContractSeriesInvariantIssue
        expr: >-
          wklive_option_operations_count{
            category="contract_series_invariant_issue"
          } > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A028
        annotations:
          summary: Option 合约系列数量、谱系或上市状态不一致
          description: >-
            tenant_id={{ $labels.tenant_id }}，异常系列数={{ $value }}；
            冻结该系列全部合约的上市审批。

      - alert: OptionPublicChainPairIssue
        expr: >-
          wklive_option_operations_count{
            category="public_chain_pair_issue"
          } > 0
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A029
        annotations:
          summary: Option 公开链同标的到期行权价 Call/Put 缺腿或重复
          description: tenant_id={{ $labels.tenant_id }}，异常链节点数={{ $value }}。

      - alert: OptionOpenInterestImbalance
        expr: >-
          wklive_option_operations_count{
            category="open_interest_imbalance"
          } > 0
        for: 1m
        labels:
          severity: warning
          catalog_id: OPT-A029
        annotations:
          summary: Option HOLDING 多空持仓总量不平衡
          description: tenant_id={{ $labels.tenant_id }}，异常合约数={{ $value }}。

      - alert: OptionAdminEconomicMutationRejected
        expr: >-
          increase(wklive_option_admin_rejected_mutation_total[5m]) > 0
        for: 0m
        labels:
          severity: info
          catalog_id: OPT-A016
        annotations:
          summary: Option 管理员越权修改受治理状态或经济字段被拒绝
          description: >-
            tenant_scope={{ $labels.tenant_scope }},
            object_type={{ $labels.object_type }}, reason={{ $labels.reason }}；
            五分钟拒绝次数={{ $value }}，保留应用和网关审计。

      - alert: OptionAdminEconomicMutationBurst
        expr: >-
          increase(wklive_option_admin_rejected_mutation_total[5m]) > 3
        for: 0m
        labels:
          severity: warning
          catalog_id: OPT-A016
        annotations:
          summary: Option 管理员越权修改尝试五分钟超过3次
          description: >-
            tenant_scope={{ $labels.tenant_scope }},
            object_type={{ $labels.object_type }}, reason={{ $labels.reason }}；
            升级安全和值班团队调查凭证、来源和变更工单。

      - alert: OptionDailyConservationMismatch
        expr: >-
          wklive_option_operations_count{
            category="daily_conservation_issue"
          } > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A015
        annotations:
          summary: Option/Asset 日终资金守恒差额非零
          description: >-
            tenant_id={{ $labels.tenant_id }}，开放日终差额数={{ $value }}；
            暂停次日相关产品开放并由技术、清算、财务、合规共同核对。

      - alert: OptionDailyConservationHeartbeatMissing
        expr: >-
          wklive_option_operations_count{
            category="daily_conservation_heartbeat_missing"
          } > 0
        for: 15m
        labels:
          severity: critical
          catalog_id: OPT-A015
        annotations:
          summary: Option/Asset 完整日终资金守恒超过36小时无成功心跳
          description: >-
            tenant_id={{ $labels.tenant_id }}；scope=1 钱包镜像成功不能替代本告警，保持次日
            产品门禁关闭并核对 Asset/财务 scope=2 生产者和不可变证据。

      - alert: OptionDailyMirrorReconciliationMismatch
        expr: >-
          wklive_option_operations_count{
            category="daily_mirror_reconciliation_mismatch"
          } > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A031
        annotations:
          summary: Option 钱包镜像日终核对存在差异
          description: >-
            tenant_id={{ $labels.tenant_id }}；最近一次一致性快照发现 Asset Option 钱包与
            t_option_account 不一致，保持真实资金门禁关闭并从 ACCOUNT_MIRROR 案件下钻。

      - alert: OptionDailyMirrorReconciliationFailed
        expr: >-
          wklive_option_operations_count{
            category="daily_mirror_reconciliation_failed"
          } > 0
        for: 0m
        labels:
          severity: critical
          catalog_id: OPT-A031
        annotations:
          summary: Option 钱包镜像日终核对执行失败
          description: >-
            tenant_id={{ $labels.tenant_id }}；检查数据库可用性、任务日志和不可变运行记录后，
            使用原租户范围重新执行，不得把失败当作零差额。

      - alert: OptionDailyMirrorReconciliationMissing
        expr: >-
          wklive_option_operations_count{
            category="daily_mirror_reconciliation_missing"
          } > 0
        for: 15m
        labels:
          severity: critical
          catalog_id: OPT-A031
        annotations:
          summary: Option 钱包镜像超过36小时无成功心跳
          description: >-
            tenant_id={{ $labels.tenant_id }}；保持次日产品门禁关闭，核对 System cron、Kafka
            option-tasks 消费和 t_option_reconciliation_run 后补跑。
