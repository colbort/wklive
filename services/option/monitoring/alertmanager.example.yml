# Example only. Every REPLACE_BEFORE_DEPLOY value must be rendered from the
# production secret/configuration system. Never deploy this file unchanged.
route:
  receiver: option-sev2
  group_by: [alertname, catalog_id, tenant_id]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 30m
  routes:
    - matchers:
        - severity="critical"
      receiver: option-sev1
      group_wait: 0s
      repeat_interval: 5m
    - matchers:
        - severity="warning"
      receiver: option-sev2
      repeat_interval: 30m
    - matchers:
        - severity="info"
      receiver: option-sev3
      repeat_interval: 4h

receivers:
  - name: option-sev1
    webhook_configs:
      - url: https://REPLACE_BEFORE_DEPLOY/option/sev1
        send_resolved: true
  - name: option-sev2
    webhook_configs:
      - url: https://REPLACE_BEFORE_DEPLOY/option/sev2
        send_resolved: true
  - name: option-sev3
    webhook_configs:
      - url: https://REPLACE_BEFORE_DEPLOY/option/sev3
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity=~"warning|info"
    equal: [catalog_id, tenant_id]
  - source_matchers:
      - severity="warning"
    target_matchers:
      - severity="info"
    equal: [catalog_id, tenant_id]
