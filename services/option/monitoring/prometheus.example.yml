global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/option-alert-rules.yml
  - /etc/prometheus/rules/option-operations-alert-rules.yml

scrape_configs:
  - job_name: wklive-option-rpc
    metrics_path: /metrics
    static_configs:
      - targets:
          - option-rpc:9105
