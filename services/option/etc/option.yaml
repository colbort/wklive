Name: option.rpc
ListenOn: 0.0.0.0:8085
Mode: dev
Prometheus:
  Host: 0.0.0.0
  Port: 9105
  Path: /metrics
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: option.rpc

AssetRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: asset.rpc

DelayQueue:
  Enabled: true
  Beanstalks:
  - Endpoint: 127.0.0.1:11300
    Tube: option-lifecycle
  - Endpoint: 127.0.0.1:11301
    Tube: option-lifecycle

MarketSnapshotInboxCleanup:
  RetentionHours: 720
  IntervalMinutes: 60
  BatchSize: 5000
  MaxBatchesPerRun: 10

InsuranceInventoryExit:
  Enabled: false
  # All five limits are mandatory and must be positive before Enabled can be true.
  MaxQuantityPerRequest: "0"
  MaxPremiumPerRequest: "0"
  MaxDailyQuantity: "0"
  MaxMarkDeviationRatio: "0"
  MinOrderBookQuantity: "0"

# Keep disabled until Asset enforces an approved per-request, daily and
# aggregate credit/funding limit. When disabled, PLATFORM_BACKSTOP contracts
# stay pending and an existing liquidation deficit is routed to manual review.
PlatformBackstop:
  Enabled: false

# Optional product capabilities are fail-closed. Production must render these
# values from the approved release scope; readiness verifies the rendered file.
ProductScope:
  SellerTradingEnabled: false
  PortfolioMarginEnabled: false
  PhysicalDeliveryEnabled: false
  ComplexOrdersEnabled: false
  PublicMarketEnabled: false
  MMPEnabled: false
  AmericanExerciseEnabled: false
